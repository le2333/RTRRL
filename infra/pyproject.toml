[project]
name = "streaming-rtrrl-infra"
version = "0.0.0"
requires-python = ">=3.11,<3.12"
dependencies = ["boto3>=1.40,<2", "optuna>=4,<5", "pyyaml>=6,<7"]

[project.scripts]
trainerctl = "trainer_infra.cli:main"
study-scheduler = "trainer_infra.scheduler_cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.15,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trainer_infra"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-m 'not service and not stress'"
markers = [
    "integration: crosses two or more production ownership boundaries",
    "service: starts a real external process or service",
    "stress: works at the size the production artifacts really are",
]

[tool.ruff]
line-length = 100
