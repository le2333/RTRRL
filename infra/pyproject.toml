[project]
name = "streaming-rtrrl-infra"
version = "0.0.0"
requires-python = ">=3.11,<3.12"
dependencies = ["optuna>=4,<5", "pyyaml>=6,<7"]

[project.scripts]
trainerctl = "trainer_infra.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.15,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trainer_infra"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: crosses two or more production ownership boundaries",
]

[tool.ruff]
line-length = 100
