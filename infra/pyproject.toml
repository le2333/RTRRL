[project]
name = "streaming-rtrrl-infra"
version = "0.0.0"
requires-python = ">=3.11,<3.12"
dependencies = ["optuna>=4,<5", "pyyaml>=6,<7"]

[project.scripts]
trainerctl = "trainer_infra.cli:main"

[dependency-groups]
# pydantic is here and not in dependencies: it is what the worker validates an
# arriving run configuration with, and the round-trip test runs that validator
# against what this side produces. Nothing shipped imports it.
dev = ["pytest>=8,<9", "ruff>=0.15,<1", "pydantic>=2.8,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trainer_infra"]

[tool.pytest.ini_options]
# ../memo is on the path, not installed: the round-trip test imports the
# worker's contract module, which is pydantic and nothing else. Installing the
# package would bring jax, aim and aimrocks onto a control plane that has no
# use for any of them, and aimrocks has no Windows wheel at all.
pythonpath = ["src", "../memo"]

[tool.ruff]
line-length = 100
