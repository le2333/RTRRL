# Backup W&B Sweep for the Brax PPO HalfCheetah baseline (ppo_baseline.py).
# Main HPO now uses control/hpo (Optuna scheduler + Aim history).
#
# How it works:
# - Hyperparameters are injected by the sweep controller into wandb.config.
#   logging_util.with_logger expands dotted keys (ppo_overrides.*) into nested
#   fields and merges them into PPOParams, so they reach brax ppo.train().
# - `command` has NO ${args}: params flow only via wandb.config (simple_parsing
#   must not see --ppo_overrides.* flags). The base config (env, num_timesteps,
#   etc.) comes from /tmp/run-config.yml, injected at submit time.
# - Sweep runs log to both Aim and W&B. W&B controls the sweep; Aim remains the
#   local source of truth for the advisor/scheduler and historical analysis.
#
# Create the sweep (on the jump host, after `wandb login`):
#   infra/sweep.sh create
# Launch N parallel agents on Batch (each pulls trials from the controller):
#   infra/sweep.sh launch <entity/project/sweep_id> 4 --config config/ppo_hc_036.yml

program: ppo_baseline.py
method: bayes
metric:
  # Rewards runs that are high near 20M steps, peak near 2500, and do not keep
  # improving far past 25M. See _halfcheetah_target_metrics in ppo_baseline.py.
  name: hc_target_score
  goal: maximize

parameters:
  ppo_overrides.batch_size:
    values: [64]
  ppo_overrides.num_envs:
    values: [2048]
  ppo_overrides.num_evals:
    values: [50]
  ppo_overrides.reward_scaling:
    values: [1]
  ppo_overrides.discounting:
    values: [0.95]
  ppo_overrides.learning_rate:
    distribution: log_uniform_values
    min: 0.0002
    max: 0.0007
  ppo_overrides.entropy_cost:
    distribution: log_uniform_values
    min: 0.006
    max: 0.014
  ppo_overrides.unroll_length:
    values: [5, 10, 15]
  ppo_overrides.num_minibatches:
    values: [64, 96, 128]
  ppo_overrides.num_updates_per_batch:
    values: [8, 10, 12]

command:
  - python
  - ${program}
  - --config_path
  - /tmp/run-config.yml
  - --logging
  - aim+wandb
  - --log_repo
  - aim://172.31.62.192:53800

# Optional early stopping (uncomment to prune weak trials):
# early_terminate:
#   type: hyperband
#   min_iter: 5
