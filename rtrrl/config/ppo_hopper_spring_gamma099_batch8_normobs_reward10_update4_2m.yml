logging: "aim"
log_repo: ".aim"
env_params:
  env_name: "brax-hopper"
  init_kwargs:
    backend: "spring"
num_timesteps: 2000000
ppo_overrides:
  discounting: 0.99
  num_evals: 10
  batch_size: 8
  normalize_observations: true
  reward_scaling: 10
  unroll_length: 5
  num_minibatches: 8
  num_updates_per_batch: 4
