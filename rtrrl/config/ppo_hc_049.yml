logging: "aim"
log_repo: ".aim"
run_name: "PPO-HC-049 single-env single-step streaming PPO"
seed: 3
env_params:
  env_name: "brax-halfcheetah"
  obs_mask: [0, 2, 4, 6, 8, 10, 12, 14, 16]
  max_ep_length: 1000
  init_kwargs:
    backend: "spring"
num_timesteps: 3000000
ppo_overrides:
  num_evals: 50
  reward_scaling: 1
  action_repeat: 1
  normalize_observations: true
  unroll_length: 1
  num_minibatches: 1
  num_updates_per_batch: 1
  discounting: 0.95
  learning_rate: 0.0003
  entropy_cost: 0.001
  num_envs: 1
  batch_size: 1
