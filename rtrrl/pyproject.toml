[project]
name = "rtrrl"
version = "0.1.0"
description = ""
readme = "README.md"
# Narrowed from the fork's original >=3.10 by training-sdk, which is pinned to
# 3.12 because that is the interpreter every trainer image in this repository
# runs. uv requires a project's floor to be inside its dependencies', so this
# had to move; nothing in the fork's own code cares, and the image was always
# going to be built on 3.12 whatever this line said.
requires-python = ">=3.12,<3.13"
dependencies = [
    # Pin JAX to the version the authors used. JAX 0.6+ removed the self-alias
    # `jax.jax` and changed array types, breaking the upstream code unmodified
    # (envs/wrappers.py uses jax.jax.tree.map; aim 3.28 can't track 0.6 arrays).
    "jax==0.5.0",
    "jaxlib==0.5.0",
    "flax>=0.10.2,<0.11",
    "plotly>=5.24.1,<6",
    "dacite>=1.8.1,<2",
    "simple-parsing>=0.1.6,<0.2",
    "distrax>=0.1.5,<0.2",
    "tqdm>=4.67.1,<5",
    "poethepoet>=0.31.1,<0.32",
    "gymnax>=0.0.8,<0.0.9",
    "brax>=0.10.4,<0.11",
    "optax>=0.2.2,<0.3",
    "pyhopper>=1.2.3,<2",
    "mujoco-mjx>=3.1.6,<4",
    "popjym @ git+https://github.com/EdanToledo/popjym.git",
    "flashbax>=0.1.2,<0.2",
    "aim==3.28.0",
    "wandb>=0.18,<0.20",
    "setuptools>=80.0.0,<81",
    # Reporting goes through the SDK, the same one memo reports through, so the
    # five arms of the Hopper comparison land in one Aim repository under one
    # set of metric names and one scoring path.
    "training-sdk",
]

[dependency-groups]
# The checks `entries/`, `scripts/` and `tests/` are held to. They are not run
# over the fork's own files: reformatting the authors' code would make every
# future diff against their repository unreadable, which is the one thing this
# arm exists to protect.
dev = [
    "pytest>=8,<9",
    "black>=26.3.1",
    "isort>=8.0.1",
    "ruff>=0.15.22",
    "pyright",
]

[tool.uv]
package = false

[tool.uv.sources]
training-sdk = { path = "../training-sdk" }

[tool.pytest.ini_options]
# The fork's root has to be importable for `entries` and `scripts` to be, and
# `testpaths` keeps a bare `pytest` from walking into `infra/`, which holds two
# other projects with two other virtual environments.
pythonpath = ["."]
testpaths = ["tests"]

[tool.poe.tasks]
install_jax_cuda12 = "uv pip install \"jax[cuda12]==0.5.0\""
