study: rtrrl-hop-stream-v1
seed: 1

aim:
  repo: ../../logs/aim
  include_name_regex: "^(RTRRL-HOP|rtrrl-hop|brax-hopper)"
  skip_archived: true
  # Objective = eval/rewards at 1M log step. Goal: 1000 @ 1M.
  target: rtrrl_hop_r1m
  goal: 1000
  direction: maximize

filters:
  env_params.env_name: brax-hopper
  env_params.batch_size: 1
  steps: 1000
  hidden_size: 32
  mlp_actor: false

base:
  config: ../../config/rtrrl_hop_stream_base_1m.yml
  entry: rtrrl.py
  logging: aim
  log_repo: aim://172.31.62.192:53800
  total_env_steps: 1000000
  eval_points: 20

# Streaming RTRRL Hopper search. No PPO fields.
# Fixed network structure (not scanned): rnn_model=lru, gradient_mode=rflo,
# hidden_size=32, wiring=fully_connected, mlp_actor=false, pass_obs is scanned.
search_space:
  env_params.batch_size:
    type: categorical
    choices: [1]
    default: 1
  optimizer_params_td.learning_rate:
    type: categorical
    choices: [1.0e-7, 3.0e-7, 1.0e-6, 3.0e-6, 1.0e-5, 2.0e-5, 3.0e-5, 5.0e-5, 1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2]
  optimizer_params_rnn.learning_rate:
    type: categorical
    choices: [1.0e-7, 3.0e-7, 1.0e-6, 2.0e-6, 3.0e-6, 5.0e-6, 7.0e-6, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2]
  lambda_v:
    type: categorical
    choices: [0.50, 0.70, 0.85, 0.88, 0.90, 0.92, 0.93, 0.94, 0.95, 0.97, 0.99]
  lambda_pi:
    type: categorical
    choices: [0.50, 0.70, 0.85, 0.90, 0.93, 0.95, 0.96, 0.965, 0.97, 0.975, 0.98, 0.99]
  lambda_rnn:
    type: categorical
    choices: [0.50, 0.70, 0.85, 0.90, 0.93, 0.94, 0.945, 0.95, 0.955, 0.96, 0.97, 0.99]
  gamma:
    type: categorical
    choices: [0.80, 0.85, 0.90, 0.93, 0.95, 0.97, 0.99, 0.995]
    default: 0.99
  update_period:
    type: categorical
    choices: [1.0, 0.7, 0.5, 0.4, 0.3, 0.2, 0.15, 0.12, 0.11, 0.1, 0.09, 0.08, 0.07, 0.03, 0.01]
    default: 1.0
  trace_mode:
    type: categorical
    choices: ["accumulate", "dutch"]
  entropy_rate:
    type: categorical
    choices: [0.0, 1.0e-8, 1.0e-7, 3.0e-7, 1.0e-6, 3.0e-6, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 7.0e-4, 1.0e-3, 1.5e-3, 2.0e-3, 3.0e-3, 1.0e-2]
  eta_pi:
    type: categorical
    choices: [0.03, 0.1, 0.2, 0.25, 0.3, 0.32, 0.35, 0.38, 0.4, 0.5, 0.7, 1.0, 2.0, 2.5, 3.0, 5.0, 10.0]
    default: 1.0
  eta_f:
    type: categorical
    choices: [0.0, 0.03, 0.05, 0.08, 0.1, 0.12, 0.15, 0.2, 0.25, 0.3, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 1.0, 2.0]
    default: 1.0
  normalize_obs:
    type: categorical
    choices: [false, true]
    default: false
  normalize_reward:
    type: categorical
    choices: [false, true]
    default: false
  pass_obs:
    type: categorical
    choices: [false, true]
    default: false
constraints:
  candidate_pool_multiplier: 8
  max_duplicate_retries: 512

resource_policy:
  default_profile: c7a-medium

profiles:
  c7a-medium:
    queue: rtrrl-cpu-c7am-queue
    job_def: rtrrl-cpu-c7am-job
    instance_type: c7a.medium
    estimated_cost_per_hour: 0.011

budget:
  max_jobs_per_round: 32
  max_total_jobs: 512
  max_estimated_cost: 6.0
