name: rtrrl
argv: [python, rtrrl.py, --config_path, "{config_path}"]
sdk_protocol_version: "1"
defaults:
  environment:
    name: brax-hopper
    options:
      backend: spring
      observation_mode: P
      max_episode_steps: 1000
  training_budget:
    env_steps: 2000000
  logging:
    aim_every_env_steps: 10000
    rerun_every_episodes: 100
objective:
  metric: eval/rewards
  direction: maximize
  reduction: last
environments: [brax-hopper]
fields:
  seed:
    path: seed
    type: int
    default: 0
    constraints: {ge: 0}
  hidden_size:
    path: hidden_size
    type: int
    default: 32
    searchable: true
    constraints: {gt: 0}
    default_search:
      values: [32, 64, 128]
  learning_rate:
    path: optimizer_params_td.learning_rate
    type: float
    default: 0.0001
    searchable: true
    constraints: {gt: 0}
    default_search:
      min: 0.00001
      max: 0.01
      scale: log
  gamma:
    path: gamma
    type: float
    default: 0.99
    searchable: true
    constraints: {gt: 0, le: 1}
    default_search:
      min: 0.9
      max: 1.0
      scale: linear
