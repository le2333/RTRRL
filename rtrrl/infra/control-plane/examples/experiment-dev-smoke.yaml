experiment: infra-acceptance
name: dev-smoke
description: One trial on the dev CPU queue, to prove the image runs on Batch

image: 007122174918.dkr.ecr.eu-north-1.amazonaws.com/rtrrl@sha256:d84ccca3d066ed070bd39840aebb0b04dc23d97dcaac544d2fcbca28d73dd9d9
entry: brax_ppo_acceptance
storage: s3://rtrrl-artifacts-007122174918/trainer

environment:
  id: brax::inverted_pendulum
  backend: generalized
  seed: 0

training:
  num_envs: 4
  total_steps: 128
  epoch_steps: 128

evaluation:
  steps: 100
  num_envs: 4

compute:
  instance_type: c7a.medium
  timeout_minutes: 30

hpo:
  sampler: tpe
  rounds: 1
  trials_per_round: 1
  parallel_jobs: 1

space:
  learning_rate: [3.0e-4]

score:
  metric: episode_return
  window_steps: [0, 128]
  reduce: mean
  direction: maximize
  non_finite: worst

logging:
  aim: aim://172.31.62.192:53801
  enable_rerun: true
  rerun_every_episodes: 1
