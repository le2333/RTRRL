experiment: infra-acceptance
name: brax-ppo-smoke
description: Infrastructure-owned CPU acceptance sweep

image: 007122174918.dkr.ecr.eu-north-1.amazonaws.com/rtrrl:infra-acceptance-brax-ppo-cpu-20260725
entry: brax_ppo_acceptance
storage: s3://rtrrl-training-data

compute:
  instance_type: c7a.medium
  timeout_minutes: 60
  startup_minutes: 10
  stall_factor: 10

hpo:
  sampler: tpe
  rounds: 2
  trials_per_round: 2
  parallel_jobs: 2

space:
  env: [inverted_pendulum]
  backend: [generalized]
  total_steps: [128]
  seed: [0]
  learning_rate: {type: float, low: 1.0e-4, high: 1.0e-3, log: true}

score:
  metric: episode_return
  window_steps: [0, 128]
  reduce: mean
  direction: maximize
  non_finite: worst

logging:
  aim: aim://127.0.0.1:53801
  every_steps: 1
  rerun_every_episodes: 1
