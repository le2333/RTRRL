experiment: infra-acceptance
name: brax-ppo-smoke
description: Infrastructure-owned CPU acceptance sweep

image: 007122174918.dkr.ecr.eu-north-1.amazonaws.com/rtrrl@sha256:d84ccca3d066ed070bd39840aebb0b04dc23d97dcaac544d2fcbca28d73dd9d9
entry: brax_ppo_acceptance
storage: s3://rtrrl-artifacts-007122174918/trainer

environment:
  id: brax::inverted_pendulum
  backend: generalized
  num_envs: 4

budget:
  total_steps: 128
  epoch_steps: 128
  eval_steps: 100

compute:
  instance_type: c7a.medium
  timeout_minutes: 60

hpo:
  sampler: tpe
  rounds: 2
  trials_per_round: 2
  parallel_jobs: 1

space:
  seed: [0]
  learning_rate: {type: float, low: 1.0e-4, high: 1.0e-3, log: true}

score:
  metric: episode_return
  window_steps: [0, 128]
  reduce: mean
  direction: maximize
  non_finite: worst

logging:
  aim: aim://172.31.62.192:53801
  every_steps: 1
  rerun_every_episodes: 1
