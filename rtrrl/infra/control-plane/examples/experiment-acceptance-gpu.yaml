experiment: infra-acceptance
name: brax-ppo-gpu
description: Infrastructure-owned GPU acceptance, one fixed configuration

image: 007122174918.dkr.ecr.eu-north-1.amazonaws.com/rtrrl@sha256:5153ca698521cde78f5a61eea46ed4b38898197491633176ca2cef8c263bb9d0
entry: brax_ppo_acceptance
storage: s3://rtrrl-artifacts-007122174918/trainer

environment:
  id: brax::hopper
  backend: spring
  num_envs: 1
  observed: [0, 1, 2, 3, 4]

budget:
  total_steps: 128
  epoch_steps: 128
  eval_steps: 100

compute:
  instance_type: g6.xlarge
  timeout_minutes: 60

hpo:
  sampler: tpe
  rounds: 1
  trials_per_round: 1
  parallel_jobs: 1

space:
  env: [inverted_pendulum]
  backend: [generalized]
  seed: [0]
  learning_rate: [3.0e-4]

score:
  metric: episode_return
  window_steps: [0, 128]
  reduce: mean
  direction: maximize
  non_finite: worst

logging:
  aim: aim://172.31.62.192:53801
  every_steps: 1
  rerun_every_episodes: 1
