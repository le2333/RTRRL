[project]
name = "trainer-infra"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aim==3.28.0",
  "boto3>=1.35,<2",
  "optuna>=4,<5",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "training-sdk",
]

[project.scripts]
trainerctl = "trainer_infra.cli:main"
trainer-image-catalog = "trainer_infra.image_catalog:main"
trainer-heavy-test = "trainer_infra.heavy_test_cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "training-sdk[testing]"]

[tool.uv]
package = true

[tool.uv.sources]
training-sdk = { path = "../../../training-sdk" }

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
