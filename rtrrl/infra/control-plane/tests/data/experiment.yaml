experiment: infra-acceptance
name: brax-ppo-smoke
description: Fixture for the control-plane suite; not a shipped example

image: 007122174918.dkr.ecr.eu-north-1.amazonaws.com/rtrrl@sha256:1111111111111111111111111111111111111111111111111111111111111111
entry: brax_ppo_acceptance
storage: s3://rtrrl-artifacts-007122174918/trainer

environment:
  id: brax::hopper
  backend: spring
  seed: 0
  observed: [0, 1, 2, 3, 4]

training:
  num_envs: 1
  total_steps: 128
  epoch_steps: 128

evaluation:
  steps: 100
  num_envs: 1

compute:
  instance_type: c7a.medium
  timeout_minutes: 60

hpo:
  sampler: tpe
  rounds: 2
  trials_per_round: 2
  parallel_jobs: 2

space:
  learning_rate: {type: float, low: 1.0e-4, high: 1.0e-3, log: true}

score:
  metric: episode_return
  window_steps: [0, 128]
  reduce: mean
  direction: maximize
  non_finite: worst

logging:
  aim: aim://10.0.0.1:53801
  enable_rerun: true
  rerun_every_steps: 4
