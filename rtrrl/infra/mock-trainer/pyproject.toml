[project]
name = "brax-ppo-acceptance"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "brax==0.14.2",
    "boto3>=1.35,<2",
    "jax==0.10.0",
    "jaxlib==0.10.0",
    "numpy>=2",
    "orbax-checkpoint==0.12.1",
    "pyyaml>=6,<7",
    "training-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
cuda12 = ["jax[cuda12]==0.10.0"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.uv.sources]
training-sdk = { path = "../../../training-sdk" }

[tool.hatch.build.targets.wheel]
packages = ["src/brax_ppo_acceptance"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
