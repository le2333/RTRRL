experiment: streamac-hopper
name: seeds-upstream-point-on-upstream-seed4
description: >
  The reference, at the point the upstream search found, at five seeds.

  One run per cell could not be read. The same point that scored 1025 under this
  kernel scored 261 once the seed was spent the reference's way -- same code, same
  parameters, a different draw -- and that spread is wider than any gap between
  the cells it was meant to measure. So the cells are drawn five times each, which
  is affordable now that truncated credit runs a two-million-step trial in five
  minutes rather than the twenty exact credit takes.

  Read down a column for what a framework does with a point across draws, and
  across a row for whether the two frameworks differ by more than the draw does.
  Both kernels now begin each seed from the same parameters and the same
  environment resets, asserted leaf by leaf at zero last bits, so a row is a
  matched pair rather than two independent experiments that happen to share a
  number.

image: 007122174918.dkr.ecr.eu-north-1.amazonaws.com/rtrrl@sha256:db44f57d2a09848e3bd75908a8a43bec196bc478f45c8593b2064fc7822eaa7e
entry: upstream_stream_ac
storage: s3://rtrrl-artifacts-007122174918/trainer

environment:
  id: brax::hopper
  backend: spring
  observed: [0, 1, 2, 3, 4]
  seed: 4

training:
  num_envs: 16
  total_steps: 2000000
  epoch_steps: 100000

evaluation:
  steps: 1000
  num_envs: 16

compute:
  # What the search ran on: two cores and 3.5 GiB, about 19 minutes for these
  # two million steps, and 40% cheaper per trial than the xlarge that was 21%
  # faster. A c7a.medium runs out of memory on sixteen streams.
  instance_type: c7a.large
  timeout_minutes: 90

hpo:
  sampler: grid
  rounds: 1
  trials_per_round: 1
  parallel_jobs: 1

space:
  backbone: [rtu]
  hidden_dim: [128]
  feature_dim: [32]
  meta_rl: [true]
  normalize_observation: [true]
  normalize_reward: [true]
  gamma: [0.99]
  # The point the reference's own search settled on, copied unrounded.
  trace_lambda: [0.9797411807117462]
  actor_lr: [0.05499866812307019]
  critic_lr: [0.0010141983465261348]
  actor_kappa: [9.247649246034655]
  critic_kappa: [9.826203892009069]
  entropy_coefficient: [1.6264746914214218e-06]
  bounded_rule: ["obgd"]
  beta2: [0.999]
  eps: [1.0e-8]

score:
  metric: eval/episode_return
  window_steps: [0, 2000000]
  reduce: max
  direction: maximize
  non_finite: worst

logging:
  aim: aim://172.31.62.192:53801
  every_steps: 1
  rerun_every_episodes: 16
