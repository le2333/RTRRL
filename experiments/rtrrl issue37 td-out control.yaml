# Issue 37 TD-out: the named unsafe negative control for D-RTRRL.
#
# `magnitude: td_error` is `eta * delta * z_hat`, so the step is `eta * |delta|`
# long. This arm exists to be run and to fail, and the failure is the result.
#
# What it is controlling for: D-RTRRL's claim is that removing |delta| from the
# step length is what buys stability, not that normalizing the trace is. The
# only way to separate those is to normalize the trace and keep |delta|, which
# is this. If this arm were to survive, D-RTRRL's default would be unjustified.
#
# Expected outcome, and how it is recorded:
#   - the run goes non-finite, typically within the first few hundred steps,
#     via critic positive feedback: an overshoot grows the next |delta|, which
#     grows the next step
#   - `score.non_finite: worst` makes that a scored result rather than a crash,
#     so it lands in the study beside the arms that finished
#   - the 10k cap is the other termination: if it has not diverged by then the
#     arm has not been shown to be unsafe and the D-RTRRL default needs its
#     justification revisited rather than quietly kept
#
# Do not "fix" this configuration if it fails. A failure here is the finding.
#
# One trial, not a search. Tuning an arm whose purpose is to diverge would only
# find the eta at which it diverges slowest.

experiment: rtrrl-issue37
name: rtrrl-issue37-td-out-control
description: "Issue 37 TD-out: unsafe negative control, eta * delta * z_hat"

image: 007122174918.dkr.ecr.eu-north-1.amazonaws.com/rtrrl@sha256:7ca201c304dc6a38dc45d8142cfc05d1ec4deb3046e9e8e3594b4ff635cfd32d
entry: rtrrl
storage: s3://rtrrl-artifacts-007122174918/trainer

# Masked Hopper, as issue 27 runs it: six of the eleven readings, velocities
# withheld. Partial observation is what the recurrent torso is there for.
environment:
  id: brax::hopper
  backend: spring
  observed: [0, 2, 4, 6, 8, 10]
  seed: 0
  episode_length: 1000

training:
  num_envs: 1
  total_steps: 10000
  chunk_steps: 1000

evaluation:
  every_steps: 1000
  rollout_steps: 1000

logging:
  aim:
    url: aim://172.31.62.192:53801
    training:
      log_every_steps: 1000
  rerun:
    log_every_steps: 1000

score:
  metric: eval/episode/return_per_step
  window_steps: [0, 10000]
  reduce: last
  non_finite: worst
  direction: maximize

compute:
  instance_type: c7a.large
  timeout_minutes: 60

hpo:
  rounds: 1
  trials_per_round: 1
  parallel_jobs: 1
  startup_trials: 1
  seed: 0

space:
  torso:
    backbone:
      kind: [lru]
      lru:
        feature_dim: [64]
        hidden_dim: [64]
        differentiation:
          kind: [exact_rtrl]
    optimizer:
      kind: [d_rtrrl]
      d_rtrrl:
        # Pinned at the middle of D-RTRRL's searched range, so the arms differ
        # in `magnitude` and in nothing else.
        eta: [0.003]
        magnitude: [td_error]
        scope: [block]
        # The preregistered denominator, z / (||z|| + eps). `clamped` is
        # max(||z||, eps), which is a different rule near zero rather than a
        # different spelling of this one.
        denominator: [shifted]
        eps: [0.00000001]
    # Kept on, and here it can bite. Under `td_error` the traced part is
    # `eta * |delta|` long rather than `eta`, so nothing in this arm is bounded
    # by construction and the clip is the last thing between the feedback loop
    # and the float. It is left at D-RTRRL's value so the arms differ in
    # `magnitude` alone -- if the clip were removed here, a divergence would be
    # evidence about the clip rather than about |delta|.
    grad_clip: [1.0]
    follow: [1.0]
  heads:
    optimizer:
      kind: [d_rtrrl]
      d_rtrrl:
        eta: [0.003]
        magnitude: [td_error]
        scope: [block]
        denominator: [shifted]
        eps: [0.00000001]
  actor:
    head:
      kind: [state_std]
      state_std:
        initialization:
          kind: [lecun]
  critic:
    head:
      kind: [value]
      value:
        initialization:
          kind: [lecun]
  normalization:
    observation:
      kind: [none]
    reward:
      kind: [none]
  gamma: [0.99]
  lambda_pi: [0.9]
  lambda_v: [0.9]
  lambda_rnn: [0.9]
  eta_pi: [1.0]
  eta_f: [1.0]
  entropy_rate: [0.00001]
  meta_rl: [true]
