experiment: streamac-hopper
name: probe-g6x
description: >
  One tenth of the reproduction run, to price it. One of three files that differ
  only in instance_type -- c7am, c7al, c7ax, g6x -- so that what a trial costs and how
  long it takes are measured rather than assumed before twenty of them are
  launched.

  Two things are being read. Throughput: sixteen streams of this size make small
  kernels, and a kernel too small to fill a GPU spends its time launching rather
  than computing, so this may well lose to two CPU cores. Whether it does is the
  question, because if it wins it wins by a lot. Reliability: the last GPU image
  aborted on a double free before it finished compiling, which is why the
  reproduction ran on CPU, and whether that is still true is worth one job.

  Two epochs, which is the shape of the real run rather than a shortcut: the
  first pays for compilation and the second does not, so the pair separates
  startup from steady state. Everything else is pinned to the settings the
  recorded 1043.66 run used, so the work being timed is the work.

