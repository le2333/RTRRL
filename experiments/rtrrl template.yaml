experiment: rtrrl-test
name: template
description: ""

image: 007122174918.dkr.ecr.eu-north-1.amazonaws.com/rtrrl@sha256:5bf83b80df2d22771601a368f6ce72233de7b2f49869da90ca1bd76b5ebaec8e
entry: rtrrl
storage: s3://rtrrl-artifacts-007122174918/trainer

environment:
  id: brax::hopper
  backend: spring
  observed: [0, 2, 4, 6, 8, 10]
  seed: 0

training:
  num_envs: 1
  total_steps: 2000000
  epoch_steps: 100000

evaluation:
  steps: 1000
  num_envs: 1

compute:
  instance_type: c7a.medium
  timeout_minutes: 60

hpo:
  sampler: tpe
  rounds: 5
  trials_per_round: 4
  parallel_jobs: 4

space:
  # structure
  backbone: [lru]
  hidden_dim: [32]
  feature_dim: [32]
  meta_rl: [true]
  bound_actor: [true]
  act_clip: [1.0]
  actor_to_recurrent: [true]
  critic_to_recurrent: [true]

  # normalization
  normalize_observation: [true]
  normalize_reward: [true]

  # td(lambda)
  freeze_gamma: [false]
  update_period: [1.0]
  update_trace_before_td: [false]

  # optimizer
  optimizer: [adam]
  eps: [1.0e-8]
  b1: [0.9]
  b2: [0.999]
  rnn_grad_clip: [1.0]

  # overshoot-bound
  obgd_rule: [false]

score:
  metric: eval/episode_return
  window_steps: [0, 2000000]
  reduce: max
  direction: maximize
  non_finite: worst

logging:
  aim: aim://172.31.62.192:53801
  every_steps: 1
