# Issue 32 comparison, memo arm: RTRRL on a discrete, partially observed task.
#
# Paired with "rtrrl minesweeper aaai.yaml", which runs the authors' own
# implementation on the same task with the same values for every knob both
# implementations have. A difference between the two is then a difference in
# the implementation rather than in the run -- which is the only claim this
# pair is allowed to support.
#
# Minesweeper Easy is a 4x4 board: sixteen actions, an observation that reports
# only the neighbour count of the cell just probed, and an episode that ends on
# the first mine or after fourteen probes. A policy that does not remember
# where it has already been cannot do better than chance, which is the point of
# choosing it over CartPole.
#
# Not tuned. Every value here is either the reference implementation's own
# default or the value the other arm is pinned to; no search has been run on
# this task by either side, and the pair answers "is this implementation worse"
# rather than "how good can it be".
#
# What the run is read for:
#   - the worker exits 0 and publishes result.json and metrics.jsonl
#   - one hundred eval/episode/return records, every 100k steps
#   - every train/episode and eval/episode value is finite
#   - eval/episode/return above the -0.0357 a uniform policy scores

experiment: rtrrl-issue32-minesweeper
name: rtrrl-issue32-minesweeper-memo
description: "Issue 32: memo's RTRRL on POPJym Minesweeper Easy, 10M steps"

# TODO: the image this pins does not exist yet. The published memo image
# installs no optional extras, and popjym is one, so a Minesweeper run inside
# it fails on the import. Needs docker/Dockerfile.cpu to sync `--extra popjym`
# and a rebuild; the digest that rebuild reports goes here.
image: TBD
entry: rtrrl
storage: s3://rtrrl-artifacts-007122174918/trainer

environment:
  id: popjym::MinesweeperEasy
  backend: null # popjym ships one implementation per environment
  observed: null # the observation is two numbers; there is nothing to withhold
  seed: 0
  # The environment's own limit, in its own class rather than in its EnvParams.
  # Stated here because the run document has to state one, not because this can
  # move it.
  episode_length: 14

# One stream, as the reference runs it (batch_size=1). The chunk is the
# reference's own scan length.
training:
  num_envs: 1
  total_steps: 10000000
  chunk_steps: 1000

evaluation:
  every_steps: 100000
  rollout_steps: 1400 # one hundred episodes at the cap

logging:
  aim:
    url: aim://172.31.62.192:53801
    training:
      log_every_steps: 100000
  rerun:
    log_every_steps: 1000000

# Return rather than return_per_step: Minesweeper pays a different amount per
# probe depending on what was under it, so the per-step average is not degenerate
# the way CartPole's is -- but the episode total is what the task is scored on
# and what the other arm reports, and the arms have to be read on one metric.
score:
  metric: eval/episode/return
  window_steps: [0, 10000000]
  reduce: last
  non_finite: worst
  direction: maximize

compute:
  instance_type: c7a.large
  timeout_minutes: 720

hpo:
  rounds: 1
  trials_per_round: 1
  parallel_jobs: 1
  startup_trials: 1
  seed: 0

space:
  torso:
    backbone:
      kind: [lru]
      lru:
        feature_dim: [64]
        hidden_dim: [64]
        differentiation:
          kind: [exact_rtrl]
    optimizer:
      kind: [adam]
      adam:
        lr: [0.0001]
    grad_clip: [1.0]
    # The reference has no slow copy of the torso, so this arm must not use one.
    follow: [1.0]
  heads:
    optimizer:
      kind: [adam]
      adam:
        lr: [0.0001]
  actor:
    # The one line issue 32 added. Against a Discrete space the three Gaussian
    # heads are refused at build time, so this cannot be left at a default.
    head:
      kind: [categorical]
      categorical:
        initialization:
          kind: [lecun]
  critic:
    head:
      kind: [value]
      value:
        initialization:
          kind: [lecun]
  normalization:
    observation:
      kind: [none]
    reward:
      kind: [none]
  gamma: [0.99]
  lambda_pi: [0.9]
  lambda_v: [0.9]
  lambda_rnn: [0.9]
  eta_pi: [1.0]
  eta_f: [1.0]
  # The reference implementation's own default (`entropy_rate: float = 1e-5`),
  # and therefore what the other arm is pinned to. Worth naming what it buys
  # here: a Categorical over sixteen actions has at most ln(16) = 2.77 nats to
  # give, so at 1e-5 the entropy term contributes almost nothing and both arms
  # explore on the sampling alone. That is the reference's choice, not a tuned
  # one, and tuning it is a separate experiment on both arms at once.
  entropy_rate: [0.00001]
  meta_rl: [true]
