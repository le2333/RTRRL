# Issue 45 R2, primary environment: characterize Original RTRRL's collapse on
# masked HalfCheetah, and keep enough state to branch from it.
#
# A formal launch under the protocol issue 46 declares: five fresh seeds, a
# `selection` block saying which trial was frozen and which seeds tuned it,
# fixed-episode evaluation, and AUC as the primary score. What issue 45 adds to
# that shape is one block and one reason:
#
#   `checkpoint` is on and keeps everything. Which boundary R3.4 forks from is
#   decided from a collapse this run has not had yet, so nothing here can know
#   which state to keep and the answer is all of them. At 10k intervals that is
#   100 objects per run, each the whole learner: parameters, traces, Adam
#   moments, the recurrent carry and its differentiation state, the
#   environment, the normalization statistics and the PRNG.
#
# Read afterwards with:
#
#   trainerctl collapse --spec experiments/collapse/halfcheetah.yaml \
#       --run <run-id>=<metrics.jsonl> ... --window-steps 50000
#   trainerctl fork --parent <that run's config> --decision <its decision> \
#       --into <directory> --steps 50000
#
# The floor and the drawdown formula belong in the collapse spec and must be
# frozen before any of this is read. They are not here because they are not a
# property of the run.

experiment: rtrrl-issue45-r2
name: rtrrl-issue45-r2-halfcheetah
description: "Issue 45 R2: Original RTRRL collapse on masked HalfCheetah, 1M steps"

# TODO: the contract-12 rebuild of the RTRRL image. It cannot silently run the
# old code -- an image whose catalog declares an earlier contract has an Entry
# that refuses a run document carrying a `checkpoint` block.
image: TBD
entry: rtrrl
storage: s3://rtrrl-artifacts-007122174918/trainer

# Masked HalfCheetah: nine of the seventeen readings, velocities withheld.
# Partial observation is what the recurrent torso is there for, and it is what
# makes this a test of a recurrent online rule rather than of a memoryless one.
environment:
  id: brax::halfcheetah
  backend: spring
  observed: [0, 1, 2, 3, 4, 5, 6, 7, 8]
  # Five fresh seeds, which is the protocol's count for Brax. Every one of them
  # runs the same frozen configuration; none of them chose it.
  seeds: [11, 12, 13, 14, 15]
  episode_length: 1000

# What makes this launch formal, and what it is claiming: the configuration was
# frozen from this study's trial, tuned on seeds the list above does not
# contain. The check is what stops a file copied from the tuning launch from
# reporting the seed that chose the configuration as a sample of it.
selection:
  study: rtrrl-issue45-tuning
  trial: 0
  tuning_seeds: [0]

training:
  num_envs: 1
  total_steps: 1000000
  chunk_steps: 10000

evaluation:
  every_steps: 10000
  # The protocol's count for Brax.
  episodes: 5
  chunk_steps: 5000
  # Declared, so the arms and the branches of this run are measured on paired
  # evaluation episodes rather than merely on the same number of them.
  seed: 1000

# Every boundary, and every one of them kept.
checkpoint:
  every_steps: 10000
  keep: null

logging:
  aim:
    url: aim://172.31.62.192:53801
    training:
      # The dashboard's view of the update scale at one moment. The window the
      # collapse analysis reads comes from `metrics.jsonl`, which keeps every
      # episode's reduction of the six per-group readings whatever this says.
      step:
        every_steps: 1000
      window:
        every_steps: 10000

score:
  metric: eval/episode/return
  window_steps: [0, 1000000]
  reduce: auc
  episodes_per_checkpoint: 5
  non_finite: worst
  direction: maximize

compute:
  instance_type: c7a.large
  timeout_minutes: 1440

# No search: a formal launch runs the configuration it froze, and every leaf
# below offers exactly one value.
hpo:
  rounds: 1
  trials_per_round: 1
  parallel_jobs: 1
  startup_trials: 1
  seed: 0

space:
  torso:
    backbone:
      kind: [lru]
      lru:
        feature_dim: [128]
        hidden_dim: [128]
        differentiation:
          kind: [exact_rtrl]
    optimizer:
      kind: [adam]
      adam:
        lr: [0.0001]
        b1: [0.9]
        b2: [0.999]
        eps: [0.00000001]
    # The original clip. This is the `C` the R3.4 arms are written over --
    # `trainerctl fork` reads it off this run's document rather than taking it
    # from anywhere else, so the two arms stay limits of *this* bound.
    grad_clip: [1.0]
    follow: [1.0]
  heads:
    optimizer:
      kind: [adam]
      adam:
        lr: [0.0001]
        b1: [0.9]
        b2: [0.999]
        eps: [0.00000001]
  actor:
    head:
      kind: [state_std]
      state_std:
        initialization:
          kind: [lecun]
  critic:
    head:
      kind: [value]
      value:
        initialization:
          kind: [lecun]
  normalization:
    observation:
      kind: [none]
    reward:
      kind: [none]
  gamma: [0.99]
  lambda_pi: [0.9]
  lambda_v: [0.9]
  lambda_rnn: [0.9]
  eta_pi: [1.0]
  eta_f: [1.0]
  entropy_rate: [0.00001]
  meta_rl: [true]
