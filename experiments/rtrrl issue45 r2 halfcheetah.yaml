# Issue 45 R2, primary environment: characterize Original RTRRL's collapse on
# masked HalfCheetah, and keep enough state to branch from it.
#
# This is the formal shape -- 1M environment steps, one of five fresh seeds per
# launch -- not a smoke run. Three things make it a collapse experiment rather
# than a training run:
#
#   1. `checkpoint` is on and keeps everything. Which boundary R3.4 forks from
#      is decided from a collapse this run has not had yet, so nothing here can
#      know which state to keep and the answer is all of them. At 10k intervals
#      that is 100 objects per run, each the whole learner: parameters, traces,
#      Adam moments, the recurrent carry and its differentiation state, the
#      environment, the normalization statistics and the PRNG.
#   2. `logging.aim.training.step` is on. The event-aligned window the analysis
#      reads comes from `metrics.jsonl`, which keeps every episode's reduction
#      of the six per-group update-scale readings whatever this block says --
#      that part is not configurable. What the step scope adds is the
#      moment-by-moment reading on the dashboard, which is how the transitions
#      inside a collapse get looked at rather than summarized.
#   3. The seeds are declared fresh and checked against the tuning seed.
#
# Read afterwards with:
#
#   trainerctl collapse --spec collapse-halfcheetah.json \
#       --run <run-id>=<metrics.jsonl> ... --window-steps 50000
#   trainerctl fork --parent <that run's config> --decision <its decision> \
#       --into <directory> --steps 50000
#
# The floor and the drawdown formula belong in the collapse spec and must be
# frozen before any of this is read. They are not in this file because they are
# not a property of the run.
#
# The primary formal metric is fixed-evaluation AUC, which #46 owns; `score`
# here is the secondary reading -- the mean over the last five checkpoints --
# because the control plane needs one number per trial and this run is not a
# search.

experiment: rtrrl-issue45-r2
name: rtrrl-issue45-r2-halfcheetah
description: "Issue 45 R2: Original RTRRL collapse on masked HalfCheetah, 1M steps"

# NOTE: this digest is the image from before the checkpoint/telemetry change and
# is here to be replaced by the one built from this commit. It cannot silently
# run the old code: that image's catalog declares contract 10, and its Entry
# refuses a run document carrying a `checkpoint` block.
image: 007122174918.dkr.ecr.eu-north-1.amazonaws.com/rtrrl@sha256:7ca201c304dc6a38dc45d8142cfc05d1ec4deb3046e9e8e3594b4ff635cfd32d
entry: rtrrl
storage: s3://rtrrl-artifacts-007122174918/trainer

# Masked HalfCheetah: nine of the seventeen readings, velocities withheld.
# Partial observation is what the recurrent torso is there for, and it is what
# makes this a test of a recurrent online rule rather than of a memoryless one.
environment:
  id: brax::halfcheetah
  backend: spring
  observed: [0, 1, 2, 3, 4, 5, 6, 7, 8]
  seed: 11
  episode_length: 1000

# The fresh seeds this environment's formal results are drawn from, and the
# tuning seed they must not overlap. One launch runs one of them: change
# `environment.seed` above and launch again with a new --launch-id.
formal:
  seeds: [11, 12, 13, 14, 15]
  tuning_seed: 0

training:
  num_envs: 1
  total_steps: 1000000
  chunk_steps: 10000

evaluation:
  every_steps: 10000
  rollout_steps: 5000

# Every boundary, and every one of them kept.
checkpoint:
  every_steps: 10000
  keep: null

logging:
  aim:
    url: aim://172.31.62.192:53801
    training:
      # The update-scale readings at one moment, for looking at the collapse
      # transition by transition on the dashboard.
      step:
        every_steps: 1000
      # And the same run's episode returns, to see the training curve beside
      # the evaluation one without sending a point per episode.
      window:
        every_steps: 10000

score:
  metric: eval/episode/return
  window_steps: [950000, 1000000]
  reduce: mean
  non_finite: worst
  direction: maximize

compute:
  instance_type: c7a.large
  timeout_minutes: 1440

# No search. This is Original RTRRL at the configuration R2 selected, run on a
# fresh seed; a search would make the seed a tuning seed again.
hpo:
  rounds: 1
  trials_per_round: 1
  parallel_jobs: 1
  startup_trials: 1
  seed: 0

space:
  torso:
    backbone:
      kind: [lru]
      lru:
        feature_dim: [128]
        hidden_dim: [128]
        differentiation:
          kind: [exact_rtrl]
    optimizer:
      kind: [adam]
      adam:
        lr: [0.0001]
        b1: [0.9]
        b2: [0.999]
        eps: [0.00000001]
    # The original clip. This is the `C` the R3.4 arms are written over --
    # `trainerctl fork` reads it off this run's document rather than taking it
    # from anywhere else, so the two arms stay limits of *this* bound.
    grad_clip: [1.0]
    follow: [1.0]
  heads:
    optimizer:
      kind: [adam]
      adam:
        lr: [0.0001]
        b1: [0.9]
        b2: [0.999]
        eps: [0.00000001]
  actor:
    head:
      kind: [state_std]
      state_std:
        initialization:
          kind: [lecun]
  critic:
    head:
      kind: [value]
      value:
        initialization:
          kind: [lecun]
  normalization:
    observation:
      kind: [none]
    reward:
      kind: [none]
  gamma: [0.99]
  lambda_pi: [0.9]
  lambda_v: [0.9]
  lambda_rnn: [0.9]
  eta_pi: [1.0]
  eta_f: [1.0]
  entropy_rate: [0.00001]
  meta_rl: [true]
