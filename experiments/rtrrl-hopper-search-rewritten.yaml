experiment: rtrrl-hopper
name: search-rewritten-20
description: ""
image: 007122174918.dkr.ecr.eu-north-1.amazonaws.com/rtrrl@sha256:5bf83b80df2d22771601a368f6ce72233de7b2f49869da90ca1bd76b5ebaec8e
entry: rtrrl
storage: s3://rtrrl-artifacts-007122174918/trainer

environment:
  id: brax::hopper
  backend: spring
  observed: [0, 1, 2, 3, 4]
  seed: 1

training:
  num_envs: 1
  total_steps: 2000000
  epoch_steps: 100000

evaluation:
  steps: 1000
  num_envs: 1

compute:
  instance_type: c7a.medium
  timeout_minutes: 60

hpo:
  sampler: tpe
  rounds: 5
  trials_per_round: 4
  parallel_jobs: 4

space:
  # structure
  backbone: [lru_rewritten]
  hidden_dim: [32]
  feature_dim: [32]
  meta_rl: [true]
  bound_actor: [true]
  act_clip: [1.0]
  actor_to_recurrent: [true]
  critic_to_recurrent: [true]

  # normalization
  normalize_observation: [false]
  normalize_reward: [false]

  # td(lambda)
  gamma: [0.99]
  freeze_gamma: [false]
  lambda_pi: {type: float, low: 0.5, high: 0.99}
  lambda_v: {type: float, low: 0.5, high: 0.99}
  lambda_rnn: {type: float, low: 0.5, high: 0.99}
  eta_pi: [1.0]
  eta_f: [1.0]
  entropy_rate: {type: float, low: 1.0e-6, high: 1.0e-3, log: true}
  update_period: [1.0]
  update_trace_before_td: [false]
  logprob_scale: [1.0]

  # optimizer
  update_rule: [adam]
  td_lr: {type: float, low: 1.0e-5, high: 1.0e-3, log: true}
  rnn_lr: {type: float, low: 1.0e-5, high: 1.0e-3, log: true}
  eps: [1.0e-8]

  # optimizer/adam
  b1: [0.9]
  b2: [0.999]
  rnn_grad_clip: [1.0]

  # optimizer/obgd
  kappa: [2.0]
  obgd_beta2: [0.999]
  obgd_rule: [obgd]

score:
  metric: eval/episode_return
  window_steps: [0, 2000000]
  reduce: max
  direction: maximize
  non_finite: worst

logging:
  aim: aim://172.31.62.192:53801
  every_steps: 1
