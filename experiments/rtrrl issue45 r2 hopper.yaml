# Issue 45 R2, secondary environment: the same characterization on masked
# Hopper. Identical in everything but the environment and the seed set, which
# is the point -- a collapse that happens on one task and not the other is a
# statement about the task, and that comparison only holds if the protocol, the
# budget, the checkpoint schedule and the telemetry are the same.
#
# See `rtrrl issue45 r2 halfcheetah.yaml` for what each block is for. The seeds
# are a different set because they are fresh per environment, and neither set
# contains a seed that tuned the configuration.

experiment: rtrrl-issue45-r2
name: rtrrl-issue45-r2-hopper
description: "Issue 45 R2: Original RTRRL collapse on masked Hopper, 1M steps"

# TODO: the contract-12 rebuild of the RTRRL image. It cannot silently run the
# old code -- an image whose catalog declares an earlier contract has an Entry
# that refuses a run document carrying a `checkpoint` block.
image: TBD
entry: rtrrl
storage: s3://rtrrl-artifacts-007122174918/trainer

# Masked Hopper, as issues 27 and 37 run it: six of the eleven readings.
environment:
  id: brax::hopper
  backend: spring
  observed: [0, 2, 4, 6, 8, 10]
  # Five fresh seeds, which is the protocol's count for Brax. Every one of them
  # runs the same frozen configuration; none of them chose it.
  seeds: [21, 22, 23, 24, 25]
  episode_length: 1000

# What makes this launch formal, and what it is claiming: the configuration was
# frozen from this study's trial, tuned on seeds the list above does not
# contain. The check is what stops a file copied from the tuning launch from
# reporting the seed that chose the configuration as a sample of it.
selection:
  study: rtrrl-issue45-tuning
  trial: 0
  tuning_seeds: [1]

training:
  num_envs: 1
  total_steps: 1000000
  chunk_steps: 10000

evaluation:
  every_steps: 10000
  # The protocol's count for Brax.
  episodes: 5
  chunk_steps: 5000
  # Declared, so the arms and the branches of this run are measured on paired
  # evaluation episodes rather than merely on the same number of them.
  seed: 1000

# Every boundary, and every one of them kept.
checkpoint:
  every_steps: 10000
  keep: null

logging:
  aim:
    url: aim://172.31.62.192:53801
    training:
      # The dashboard's view of the update scale at one moment. The window the
      # collapse analysis reads comes from `metrics.jsonl`, which keeps every
      # episode's reduction of the six per-group readings whatever this says.
      step:
        every_steps: 1000
      window:
        every_steps: 10000

score:
  metric: eval/episode/return
  window_steps: [0, 1000000]
  reduce: auc
  episodes_per_checkpoint: 5
  non_finite: worst
  direction: maximize

compute:
  instance_type: c7a.large
  timeout_minutes: 1440

# No search: a formal launch runs the configuration it froze, and every leaf
# below offers exactly one value.
hpo:
  rounds: 1
  trials_per_round: 1
  parallel_jobs: 1
  startup_trials: 1
  seed: 0

space:
  torso:
    backbone:
      kind: [lru]
      lru:
        feature_dim: [128]
        hidden_dim: [128]
        differentiation:
          kind: [exact_rtrl]
    optimizer:
      kind: [adam]
      adam:
        lr: [0.0001]
        b1: [0.9]
        b2: [0.999]
        eps: [0.00000001]
    # The original clip. This is the `C` the R3.4 arms are written over --
    # `trainerctl fork` reads it off this run's document rather than taking it
    # from anywhere else, so the two arms stay limits of *this* bound.
    grad_clip: [1.0]
    follow: [1.0]
  heads:
    optimizer:
      kind: [adam]
      adam:
        lr: [0.0001]
        b1: [0.9]
        b2: [0.999]
        eps: [0.00000001]
  actor:
    head:
      kind: [state_std]
      state_std:
        initialization:
          kind: [lecun]
  critic:
    head:
      kind: [value]
      value:
        initialization:
          kind: [lecun]
  normalization:
    observation:
      kind: [none]
    reward:
      kind: [none]
  gamma: [0.99]
  lambda_pi: [0.9]
  lambda_v: [0.9]
  lambda_rnn: [0.9]
  eta_pi: [1.0]
  eta_f: [1.0]
  entropy_rate: [0.00001]
  meta_rl: [true]
