experiment: streamac-hopper
name: reproduce-d9fe
description: >
  Reproduce the best recorded StreamAC-RTRL score on masked Brax Hopper, Aim
  run d9fe0986, eval return 1043.66. Every parameter is pinned, so this is a
  fidelity check on the rewritten kernel rather than a search. The sweep that
  found these settings only ever ran seeds 0 and 3, and seed 3 topped out at
  474.60, so the score is seed-bound and the seed below is not a free choice.

  The recorded curve is what to compare against, not just the number: eval
  return sits at 85 after the first epoch, climbs to 269 by 900k steps, jumps
  to 1043.66 at 1M, and then holds between 1014 and 1026 to the end. The score
  is the peak of that plateau, which is why the reduction below is max.

image: 007122174918.dkr.ecr.eu-north-1.amazonaws.com/rtrrl@sha256:efb23664a537470ace5b2153d3ae26c0dce7c1688e9a99e76409d5416b017411
entry: stream_ac
storage: s3://rtrrl-artifacts-007122174918/trainer

environment:
  id: brax::hopper
  backend: spring
  observed: [0, 1, 2, 3, 4]
  seed: 0

training:
  # Sixteen independent streams, each with its own trace, TD error and OBGD
  # bound, whose updates are averaged. This is not the paper's single stream:
  # it was the shared harness default that every algorithm inherited, and it
  # divides the step budget, so this run makes 125k updates rather than 2M.
  # It is kept because it is what produced the score being reproduced.
  num_envs: 16
  total_steps: 2000000
  # Twenty epochs with an evaluation after each, which is the shape the
  # recorded run used (num_epochs 20, eval_every 1, eval_steps 1000). The epoch
  # is only where training leaves JIT to report: state, traces and the
  # normalisers carry across the boundary, so the stream is unbroken.
  epoch_steps: 100000

evaluation:
  steps: 1000
  num_envs: 16

compute:
  # Four cores and 7 GiB, which is what the recorded runs used: they drew 3.4
  # to 6 cores and held about 1.8 GiB. A c7a.medium would run out of memory on
  # its 1600 MiB budget, and the GPU image aborts on a double free before it
  # finishes compiling, so this is both the affordable choice and the one that
  # matches the machine the score was set on.
  instance_type: c7a.xlarge
  timeout_minutes: 240

hpo:
  sampler: grid
  rounds: 1
  trials_per_round: 1
  parallel_jobs: 1

space:
  backbone: [rtu]
  hidden_dim: [128]
  feature_dim: [32]
  meta_rl: [true]
  normalize_observation: [true]
  normalize_reward: [true]
  # The recorded run predates the arm and so used ours, which is what reproducing
  # it requires. Their statistics are a separate experiment, not this one.
  normalization_statistics: ["ours"]
  gamma: [0.99]
  trace_lambda: [0.9060749966425912]
  actor_lr: [0.532246925974616]
  critic_lr: [0.11990103985952048]
  actor_kappa: [2.722352816476039]
  critic_kappa: [1.4401857247174306]
  entropy_coefficient: [0.000271109456772485]
  credit: [rtrl]
  bounded_rule: ["obgd"]
  beta2: [0.999]
  eps: [1.0e-8]

score:
  metric: eval/episode_return
  window_steps: [0, 2000000]
  reduce: max
  direction: maximize
  non_finite: worst

logging:
  aim: aim://172.31.62.192:53801
  every_steps: 1
  rerun_every_episodes: 16
