experiment: streamac-hopper
name: reproduce-d9fe
description: >
  Reproduce the best recorded StreamAC-RTRL score on masked Brax Hopper, Aim
  run d9fe0986, eval return 1043.66. Every parameter is pinned, so this is a
  fidelity check on the rewritten kernel rather than a search. The sweep that
  found these settings only ever ran seeds 0 and 3, and seed 3 topped out at
  474.60, so the score is seed-bound and the seed below is not a free choice.

image: PLACEHOLDER
entry: stream_ac_rtrl
storage: s3://rtrrl-artifacts-007122174918/trainer

compute:
  # Not c7a.medium: the recorded runs held ~1.8 GiB resident and drew 3.4 to 6
  # cores, so a 1 vCPU box with a 1600 MiB budget would run out of memory long
  # before it ran out of time.
  instance_type: g6.xlarge
  timeout_minutes: 240
  startup_minutes: 15
  stall_factor: 10

hpo:
  sampler: grid
  rounds: 1
  trials_per_round: 1
  parallel_jobs: 1

space:
  environment: [brax::hopper]
  # Off: the eval episodes already reach Rerun, and stacking every training
  # step's observation over a 2M-step budget would not fit.
  record_trajectory: [false]
  env_mode: [P]
  env_backend: [spring]
  backbone: [rtu]
  seed: [0]
  # Sixteen independent streams, each with its own trace, TD error and OBGD
  # bound, whose updates are averaged. This is not the paper's single stream:
  # it was the shared harness default that every algorithm inherited, and it
  # divides the step budget, so this run makes 125k updates rather than 2M.
  # It is kept because it is what produced the score being reproduced.
  num_envs: [16]
  total_steps: [2000000]
  epoch_steps: [100000]
  eval_steps: [1000]
  hidden_dim: [128]
  feature_dim: [32]
  meta_rl: [true]
  normalize_observation: [true]
  normalize_reward: [true]
  gamma: [0.99]
  trace_lambda: [0.9060749966425912]
  actor_lr: [0.532246925974616]
  critic_lr: [0.11990103985952048]
  actor_kappa: [2.722352816476039]
  critic_kappa: [1.4401857247174306]
  entropy_coefficient: [0.000271109456772485]
  adaptive: [false]
  beta2: [0.999]
  eps: [1.0e-8]

score:
  metric: eval/episode_return
  window_steps: [0, 2000000]
  reduce: max
  direction: maximize
  non_finite: worst

logging:
  aim: aim://172.31.62.192:53801
  every_steps: 1
  rerun_every_episodes: 16
