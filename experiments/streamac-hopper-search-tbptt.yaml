experiment: streamac-hopper
name: search-tbptt
description: >
  Twenty trials of our framework under truncated credit, to measure what the two
  frameworks are worth when each is allowed to be tuned rather than made to wear
  the other's settings.

  The comparison this belongs to: our kernel under exact credit found 1034.13,
  and running that point on upstream's implementation returned 324.90 while
  running it on our own truncated credit returned 270.88. That pair says the gap
  is the credit rather than the framework, but it says it at one point that was
  chosen under exact credit, and both truncated runs sat on the collapse floor
  where nothing is distinguishable. So each framework is searched over the same
  space, from the same opening four points, and compared at its own best.

  Everything outside the six searched dimensions is pinned to what the recorded
  1043.66 run used, the seed is fixed, and credit is pinned to tbptt, so this
  differs from the search that found 1034.13 in exactly one parameter. Twenty TPE
  trials over six dimensions is not a converged search; what it produces is a
  fair-ish ceiling, not a tuned setting.

image: 007122174918.dkr.ecr.eu-north-1.amazonaws.com/rtrrl@sha256:b33d69821d4dd8e601fea78b3dde331bacfd2797bda256da1dbdfeb5b1ce12a5
entry: stream_ac
storage: s3://rtrrl-artifacts-007122174918/trainer

compute:
  # Measured, not assumed: the three probe files beside this one ran one tenth of
  # a trial on each CPU queue. A c7a.medium never finished it in 45 minutes, which
  # is its 1600 MiB rather than its one core. A c7a.large finished in 162 seconds
  # and a c7a.xlarge in 134, so twice the cores buy 21% and cost twice as much,
  # and this is the cheaper of the two per trial by 40%. Both returned the same
  # score to every digit, so the choice is only about money and wall clock.
  #
  # g6.xlarge is not an option: it still aborts on a double free part way through
  # compiling, as it did when the reproduction was moved to CPU.
  instance_type: c7a.large
  # A trial of this length measured out at 13 to 19 minutes, so this is three
  # times the estimate rather than an afternoon: a trial that hangs should be cut
  # off, not billed to the timeout.
  timeout_minutes: 60

hpo:
  sampler: tpe
  rounds: 5
  trials_per_round: 4
  # Four at a time, so a round is one trial long in wall clock and the sampler
  # still gets four results to learn from before it suggests the next four.
  parallel_jobs: 4
  # Both searches below open on the same four points.
  seed: 20260728

space:
  environment: [brax::hopper]
  env_mode: [P]
  env_backend: [spring]
  backbone: [rtu]
  credit: [tbptt]
  seed: [0]
  num_envs: [16]
  total_steps: [2000000]
  epoch_steps: [100000]
  eval_steps: [1000]
  hidden_dim: [128]
  feature_dim: [32]
  meta_rl: [true]
  normalize_observation: [true]
  normalize_reward: [true]
  gamma: [0.99]
  bounded_rule: ["obgd"]
  beta2: [0.999]
  eps: [1.0e-8]
  # The six the sweep searched, each bracketing the setting it landed on by
  # about a decade either side. Wider would spend the twenty trials on the
  # regions that sweep already ruled out.
  trace_lambda: {type: float, low: 0.5, high: 0.99}
  actor_lr: {type: float, low: 0.01, high: 3.0, log: true}
  critic_lr: {type: float, low: 0.001, high: 1.0, log: true}
  actor_kappa: {type: float, low: 0.5, high: 10.0}
  critic_kappa: {type: float, low: 0.5, high: 10.0}
  entropy_coefficient: {type: float, low: 1.0e-6, high: 1.0e-2, log: true}

score:
  metric: eval/episode_return
  window_steps: [0, 2000000]
  reduce: max
  direction: maximize
  non_finite: worst

logging:
  aim: aim://172.31.62.192:53801
  every_steps: 1
  rerun_every_episodes: 16
