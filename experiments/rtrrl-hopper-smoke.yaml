experiment: rtrrl-hopper
name: smoke
description: >
  RTRRL on masked Brax Hopper at 1/40th of a trial, on a dev queue, to price the
  entry before anything is searched with it. Nothing here has ever been run: the
  rtrrl entry has been in the image and in the catalog since it was written and no
  experiment has ever pointed at it, so every number a budget would be built from
  is missing.

  The reference implementation steps one environment and updates its parameters
  after every transition. num_envs is therefore fixed at one: increasing it
  changes the optimisation process rather than merely parallelising the same
  run. The score is not expected to mean anything at a fortieth of a budget and
  is not read.

image: 007122174918.dkr.ecr.eu-north-1.amazonaws.com/rtrrl@sha256:aa3411a27ec1ea4f3b8225ffc8a9a1ebcbfebee7eef03376c7d34bab0fa74687
entry: rtrrl
storage: s3://rtrrl-artifacts-007122174918/trainer

environment:
  id: brax::hopper
  backend: spring
  observed: [0, 1, 2, 3, 4]
  seed: 1

training:
  # Part of the algorithm, not a throughput knob: the paper updates after every
  # transition from one environment.
  num_envs: 1
  total_steps: 50000
  # Divides the budget into reporting epochs.
  epoch_steps: 10000

evaluation:
  steps: 1000
  num_envs: 1

compute:
  # The streamac runs on this entry's sibling drew 3.4 to 6 cores and about
  # 1.8 GiB, and a c7a.medium could not finish a trial inside its 1600 MiB. This
  # is the smallest queue that measurement leaves standing, and what a step costs
  # here is only comparable to what it will cost in the real runs if both are on
  # the same instance type.
  instance_type: c7a.large
  # Forty times this is the trial being priced, so a smoke run that reaches the
  # timeout has already answered the question: too slow to search at this width.
  timeout_minutes: 45

hpo:
  sampler: grid
  rounds: 1
  trials_per_round: 1
  parallel_jobs: 1

space:
  backbone: [lru]
  # Their defaults at 4301943, so that the thing being priced is the thing that
  # will be run. hidden_dim is their hidden_size, and feature_dim is ours: their
  # LRU reads the raw observation where ours reads an encoder, so there is no
  # value of theirs to copy for it.
  hidden_dim: [32]
  feature_dim: [32]
  meta_rl: [true]
  normalize_observation: [false]
  normalize_reward: [false]
  # The paper constrains actor loc to [-1, 1] and log-scale to [-2, 2], then
  # clips the sampled environment action once more to Hopper's [-1, 1] bounds.
  bound_actor: [true]
  gamma: [0.99]
  lambda_pi: [0.9]
  lambda_v: [0.9]
  lambda_rnn: [0.9]
  td_lr: [1.0e-4]
  rnn_lr: [1.0e-4]
  eta_pi: [1.0]
  eta_f: [1.0]
  entropy_rate: [1.0e-5]
  update_period: [1.0]
  b1: [0.9]
  b2: [0.999]
  eps: [1.0e-8]
  rnn_grad_clip: [1.0]
  act_clip: [1.0]
  freeze_gamma: [false]
  update_trace_before_td: [false]
  logprob_scale: [1.0]
  update_rule: [adam]
  # Adam is the rule above, so these three are read and ignored. They are pinned
  # because an unpinned parameter keeps the whole domain the entry declared and a
  # grid would then refuse to run at all.
  kappa: [2.0]
  obgd_beta2: [0.999]
  obgd_rule: [obgd]
  # Both heads reach the torso, which is the wiring the entry's ablation varies
  # and this file holds still.
  actor_to_recurrent: [true]
  critic_to_recurrent: [true]

score:
  metric: eval/episode_return
  window_steps: [0, 50000]
  reduce: max
  direction: maximize
  non_finite: worst

logging:
  aim: aim://172.31.62.192:53801
  every_steps: 1
