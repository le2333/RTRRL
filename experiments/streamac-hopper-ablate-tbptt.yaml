experiment: streamac-hopper
name: ablate-tbptt
description: >
  Our kernel, trial 4's settings, and one thing changed: truncated credit
  instead of exact sensitivity. This exists to read the run beside it.

  Upstream scored 324.90 on these settings where our kernel scored 1034.13, and
  two things could account for that at once. Upstream stops the gradient at the
  incoming carry, which is our tbptt and not our rtrl, and these settings were
  tuned under rtrl. It also normalises in environment wrappers whose statistics
  restart at every evaluation. This run holds the second fixed and changes only
  the first, so the pair separates them: near 325 says the gap is the credit and
  the implementations agree; near 1034 says the gap is ours to explain.

image: 007122174918.dkr.ecr.eu-north-1.amazonaws.com/rtrrl@sha256:b33d69821d4dd8e601fea78b3dde331bacfd2797bda256da1dbdfeb5b1ce12a5
entry: stream_ac
storage: s3://rtrrl-artifacts-007122174918/trainer

environment:
  id: brax::hopper
  backend: spring
  observed: [0, 1, 2, 3, 4]
  seed: 0

training:
  num_envs: 16
  total_steps: 2000000
  epoch_steps: 100000

evaluation:
  steps: 1000
  num_envs: 16

compute:
  # What the search ran on: two cores and 3.5 GiB, about 19 minutes for these
  # two million steps, and 40% cheaper per trial than the xlarge that was 21%
  # faster. A c7a.medium runs out of memory on sixteen streams.
  instance_type: c7a.large
  timeout_minutes: 90

hpo:
  sampler: grid
  rounds: 1
  trials_per_round: 1
  parallel_jobs: 1

space:
  backbone: [rtu]
  hidden_dim: [128]
  feature_dim: [32]
  meta_rl: [true]
  normalize_observation: [true]
  normalize_reward: [true]
  normalization_statistics: ["ours"]
  gamma: [0.99]
  # Trial 4, copied from the search report rather than rounded.
  trace_lambda: [0.932732278475361]
  actor_lr: [0.01195374050032135]
  critic_lr: [0.0013159968879739295]
  actor_kappa: [0.948675622947512]
  critic_kappa: [0.5913297355240426]
  entropy_coefficient: [1.213619081634158e-06]
  bounded_rule: ["obgd"]
  credit: [tbptt]
  beta2: [0.999]
  eps: [1.0e-8]

score:
  metric: eval/episode_return
  window_steps: [0, 2000000]
  reduce: max
  direction: maximize
  non_finite: worst

logging:
  aim: aim://172.31.62.192:53801
  every_steps: 1
  rerun_every_episodes: 16
