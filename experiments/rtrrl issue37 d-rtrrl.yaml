# Issue 37 D-RTRRL: the unit-trace update rule, on the shape issue 27 already runs.
#
# The step no longer carries the TD error's magnitude. Each block's trace is
# exported as a unit vector and the TD error is reduced to its sign, so one
# step moves that block by exactly `eta` and by that much whether the step was
# a surprise or not.
#
# Read, at the reporting boundaries:
#   - train/.../update.torso_step.step_size and update.heads_step.step_size
#     constant at the two etas
#   - update.torso.trace_norm and the two head trace norms finite throughout
#   - eval/episode/return finite throughout -- the version this replaces
#     (`magnitude: td_error`) is what went non-finite here, and it is kept as a
#     named arm in `rtrrl issue37 td-out control.yaml` rather than deleted, so
#     the reason for this arm's default is a recorded run and not a claim
#
# `eta_f` is present and inert: `sign(eta_f * delta) == sign(delta)`. The
# torso-to-heads step ratio is the ratio of the two `eta` values below and
# nothing else. Left at 1.0 so a diff against the issue-27 run shows only the
# optimizer.

experiment: rtrrl-issue37
name: rtrrl-issue37-d-rtrrl
description: "Issue 37 D-RTRRL: unit-trace update, sign(delta), fixed step length"

image: 007122174918.dkr.ecr.eu-north-1.amazonaws.com/rtrrl@sha256:7ca201c304dc6a38dc45d8142cfc05d1ec4deb3046e9e8e3594b4ff635cfd32d
entry: rtrrl
storage: s3://rtrrl-artifacts-007122174918/trainer

# Masked Hopper, as issue 27 runs it: six of the eleven readings, velocities
# withheld. Partial observation is what the recurrent torso is there for.
environment:
  id: brax::hopper
  backend: spring
  observed: [0, 2, 4, 6, 8, 10]
  seed: 0
  episode_length: 1000

training:
  num_envs: 1
  total_steps: 5000
  chunk_steps: 1000

evaluation:
  every_steps: 1000
  rollout_steps: 1000

logging:
  aim:
    url: aim://172.31.62.192:53801
    training:
      log_every_steps: 1000
  rerun:
    log_every_steps: 1000

score:
  metric: eval/episode/return_per_step
  window_steps: [0, 5000]
  reduce: last
  non_finite: worst
  direction: maximize

compute:
  instance_type: c7a.large
  timeout_minutes: 60

# Two group step scales are searched, so there has to be a search. Small
# because this is the acceptance shape rather than the tuned run: enough trials
# for the two etas to separate, not enough to claim one is optimal.
hpo:
  rounds: 2
  trials_per_round: 8
  parallel_jobs: 4
  startup_trials: 4
  seed: 0

space:
  torso:
    backbone:
      kind: [lru]
      lru:
        feature_dim: [64]
        hidden_dim: [64]
        differentiation:
          kind: [exact_rtrl]
    optimizer:
      kind: [d_rtrrl]
      d_rtrrl:
        # The group step scale, searched rather than pinned. The torso-to-heads
        # ratio is not frozen at whatever the Adam arm's two learning rates
        # happened to be, because it cannot be: `eta_f` is inert under `sign`,
        # so these two etas are the only place that ratio can live and HPO has
        # to be the thing that finds it.
        eta: {type: float, low: 0.0001, high: 0.1, log: true}
        magnitude: [sign]
        scope: [block]
        # The preregistered denominator, z / (||z|| + eps). `clamped` is
        # max(||z||, eps), which is a different rule near zero rather than a
        # different spelling of this one.
        denominator: [shifted]
        eps: [0.00000001]
    # Kept on. The traced part of this rule is `eta` long by construction, so
    # the clip cannot reach it; the entropy direction does not pass through the
    # trace and is the one term here with no length of its own.
    grad_clip: [1.0]
    follow: [1.0]
  heads:
    optimizer:
      kind: [d_rtrrl]
      d_rtrrl:
        eta: {type: float, low: 0.0001, high: 0.1, log: true}
        magnitude: [sign]
        scope: [block]
        denominator: [shifted]
        eps: [0.00000001]
  actor:
    head:
      kind: [state_std]
      state_std:
        initialization:
          kind: [lecun]
  critic:
    head:
      kind: [value]
      value:
        initialization:
          kind: [lecun]
  normalization:
    observation:
      kind: [none]
    reward:
      kind: [none]
  gamma: [0.99]
  lambda_pi: [0.9]
  lambda_v: [0.9]
  lambda_rnn: [0.9]
  eta_pi: [1.0]
  eta_f: [1.0]
  entropy_rate: [0.00001]
  meta_rl: [true]
