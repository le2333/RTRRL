experiment: streamac-hopper
name: probe-c7ax
description: >
  One tenth of the reproduction run, to price it. One of three files that differ
  only in instance_type -- c7am, c7al, c7ax -- so that what a trial costs and how
  long it takes are measured rather than assumed before twenty of them are
  launched.

  Two things are being read. Throughput: this is what the reproduction ran on,
  so it is the number the other two are measured against, and the one the
  twenty-trial estimate would rest on if the cheaper queues turn out not to
  serve. Footprint: it has 7 GiB, so nothing here is expected to be tight.

  Two epochs, which is the shape of the real run rather than a shortcut: the
  first pays for compilation and the second does not, so the pair separates
  startup from steady state. Everything else is pinned to the settings the
  recorded 1043.66 run used, so the work being timed is the work.

image: 007122174918.dkr.ecr.eu-north-1.amazonaws.com/rtrrl@sha256:0beb5f44302f3b1261160bc4ffdcd524edfb1eaedec461c4e4c221c69c3b929d
entry: stream_ac
storage: s3://rtrrl-artifacts-007122174918/trainer

environment:
