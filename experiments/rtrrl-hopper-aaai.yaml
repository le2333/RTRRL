experiment: rtrrl-hopper
name: search-aaai-20
description: ""
image: 007122174918.dkr.ecr.eu-north-1.amazonaws.com/rtrrl@sha256:f7a5167b087b21d2e5e261c44bae4b0016fd662461b57ce06a3d6ec79575f7b2
entry: rtrrl_aaai
storage: s3://rtrrl-artifacts-007122174918/trainer

environment:
  id: brax::hopper
  backend: spring
  observed: [0, 1, 2, 3, 4]
  seed: 1

training:
  num_envs: 1
  total_steps: 2000000
  epoch_steps: 100000
  chunk_steps: 1000
  early_stop_patience: 0

evaluation:
  steps: 1000
  num_envs: 10

compute:
  instance_type: c7a.medium
  timeout_minutes: 60

hpo:
  sampler: tpe
  rounds: 5
  trials_per_round: 4
  parallel_jobs: 4

space:
  # structure
  backbone: [lru]
  gradient_mode: [rtrl]
  hidden_dim: [32]
  meta_rl: [true]
  f_align: [false]
  mlp_actor: [false]
  layer_norm: [false]

  # normalization
  normalize_observation: [false]
  normalize_reward: [false]

  # td(lambda)
  gamma: [0.99]
  trace_mode: [accumulate]
  lambda_pi: {type: float, low: 0.5, high: 0.99}
  lambda_v: {type: float, low: 0.5, high: 0.99}
  lambda_rnn: {type: float, low: 0.5, high: 0.99}
  eta_pi: [1.0]
  eta_f: [1.0]
  entropy_rate: {type: float, low: 1.0e-6, high: 1.0e-3, log: true}
  update_period: [1.0]
  update_trace_before_td: [false]

  # optimizer/adam
  td_lr: {type: float, low: 1.0e-5, high: 1.0e-3, log: true}
  rnn_lr: {type: float, low: 1.0e-5, high: 1.0e-3, log: true}
  rnn_grad_clip: [1.0]

score:
  metric: eval/episode_return
  window_steps: [0, 2000000]
  reduce: max
  direction: maximize
  non_finite: worst

logging:
  aim: aim://172.31.62.192:53801
  every_steps: 1
