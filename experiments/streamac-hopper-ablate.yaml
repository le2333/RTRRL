experiment: streamac-hopper
name: ablate-upstream
description: >
  Upstream's StreamAC on the settings our kernel scored 1034.13 with, which is
  trial 4 of the 20-trial search (launch 20260727-201154) and within 1% of the
  1043.66 the historical run recorded. One run, no search: the question is
  whether the two implementations behave alike over two million steps, and the
  block tests already say their arithmetic agrees to a fraction of a last bit.

  Read the curve, not only the number. Our kernel's trial 4 climbed to its peak
  and held; a comparison that lands at a similar score by a different route is a
  different answer than one that tracks it. Both report eval/episode/return in
  the task's own units -- upstream normalises rewards in a wrapper, so this
  entry digs the paid reward back out rather than summing the scaled one.

  Two differences are structural and are not being controlled for, because they
  are what upstream is: normalisation lives in wrappers whose statistics restart
  at every evaluation, and there is no credit choice, so this is our tbptt and
  not our rtrl.

image: 007122174918.dkr.ecr.eu-north-1.amazonaws.com/rtrrl@sha256:0ff8f723f2df153d4a664ca8e277c680e2a2b9a37872074758941ba30ea7009d
entry: upstream_stream_ac
storage: s3://rtrrl-artifacts-007122174918/trainer

environment:
  id: brax::hopper
  backend: spring
  observed: [0, 1, 2, 3, 4]
  seed: 0

training:
  num_envs: 16
  total_steps: 2000000
  epoch_steps: 100000

evaluation:
  steps: 1000
  num_envs: 16

compute:
  # What the search ran on: two cores and 3.5 GiB, about 19 minutes for these
  # two million steps, and 40% cheaper per trial than the xlarge that was 21%
  # faster. A c7a.medium runs out of memory on sixteen streams.
  instance_type: c7a.large
  timeout_minutes: 90

hpo:
  sampler: grid
  rounds: 1
  trials_per_round: 1
  parallel_jobs: 1

space:
  backbone: [rtu]
  hidden_dim: [128]
  feature_dim: [32]
  meta_rl: [true]
  normalize_observation: [true]
  normalize_reward: [true]
  gamma: [0.99]
  # Trial 4, copied from the search report rather than rounded.
  trace_lambda: [0.932732278475361]
  actor_lr: [0.01195374050032135]
  critic_lr: [0.0013159968879739295]
  actor_kappa: [0.948675622947512]
  critic_kappa: [0.5913297355240426]
  entropy_coefficient: [1.213619081634158e-06]
  bounded_rule: ["obgd"]
  beta2: [0.999]
  eps: [1.0e-8]

score:
  metric: eval/episode/return
  window_steps: [0, 2000000]
  reduce: max
  direction: maximize
  non_finite: worst

logging:
  aim: aim://172.31.62.192:53801
  enable_rerun: true
  rerun_every_episodes: 16
