# R2D2 acceptance, canonical branch: burn-in followed by a fixed TBPTT unroll.
#
# Paired with "r2d2 full bptt acceptance.yaml". The two files differ in the
# `learning` block and nothing else, so a difference in the result is a
# difference in the gradient construction rather than in the run.
#
# What the run is read for:
#   - the worker exits 0 and publishes result.json and metrics.jsonl
#   - four eval/episode/return records, at 5000, 10000, 15000 and 20000
#   - every train/episode and eval/episode value is finite
#   - train/episode/update.loss and update.priority appear once replay is
#     sampleable, which is at step 256

experiment: r2d2-acceptance
name: r2d2-acceptance-tbptt
description: "R2D2 platform acceptance: canonical burn-in plus truncated BPTT"

# The image this acceptance ran on, 2026-08-15. Catalog label SHA-256
# 83782310b82bdb5871e62ab48fabeb98cca915f12151be87493113e2eb32bb06.
image: 007122174918.dkr.ecr.eu-north-1.amazonaws.com/rtrrl@sha256:f5cf32acc3e61cbb38f8fa34c265add29c250a4ff9d30613c8f161dbe4f021da
entry: r2d2
storage: s3://rtrrl-artifacts-007122174918/trainer

# CartPole is fully observed and discrete. The recurrent core is not being
# asked to remember anything here: this run answers whether the platform path
# holds, not whether the memory helps.
environment:
  id: gymnax::CartPole-v1
  backend: null # gymnax ships one implementation per environment
  observed: null
  seeds: [0]
  episode_length: 32

training:
  num_envs: 1
  total_steps: 20000
  chunk_steps: 5000

evaluation:
  every_steps: 5000
  episodes: 10
  chunk_steps: 320
  seed: 1000

logging:
  aim:
    url: aim://172.31.62.192:53801
    training:
      window:
        every_steps: 5000
  rerun:
    log_every_steps: 10000

# Not return_per_step: CartPole pays exactly 1.0 every step including the one
# it ends on, so that metric is identically 1.0 for every policy -- a run that
# balances for 32 steps and one that drops the pole in 9 score the same. The
# signal is entirely in how long the episode lasted.
score:
  metric: eval/episode/return
  window_steps: [0, 20000]
  reduce: last
  non_finite: worst
  direction: maximize

compute:
  instance_type: c7a.large
  timeout_minutes: 60

hpo:
  rounds: 1
  trials_per_round: 1
  parallel_jobs: 1
  startup_trials: 1
  seed: 0

space:
  backbone:
    kind: [lru]
    lru:
      feature_dim: [64]
      hidden_dim: [64]

  head:
    kind: [dueling]

  # The one block that differs from the full-BPTT acceptance. The replay
  # window is burn_in_length + unroll_length transitions.
  learning:
    kind: [tbptt]
    tbptt:
      burn_in_length: [4]
      unroll_length: [8]

  optimizer:
    kind: [adam]
    adam:
      lr: [0.0005]

  replay:
    capacity: [8192]
    minimum_size: [256]
    batch_size: [8]
    priority_exponent: [0.9]
    importance_sampling_exponent: [0.6]
    max_priority_weight: [0.9]

  target:
    update_period: [100]

  returns:
    n_step: [3]
    value_transform:
      kind: [signed_hyperbolic]

  exploration:
    epsilon_start: [1.0]
    epsilon_end: [0.05]
    epsilon_decay_steps: [10000]
    evaluation_epsilon: [0.0]

  gamma: [0.99]
