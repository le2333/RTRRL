# 一个实验。infra 读这个文件，产出若干份运行配置交给 worker。
#
# 三类字段，按去向分：
#   [透传] 原样成为运行配置的同名块
#   [消费] infra 读它，产出运行配置里的另一个字段
#   [自用] infra 内部用，不过河
#
# infra 自己生成、这里没有的：contract、run_id、launch_id、trial。

experiment: streamac-test # [透传] aim 里的实验名
name: template # [自用] optuna study 名
description: "" # [自用]

image: 007122174918.dkr.ecr.eu-north-1.amazonaws.com/rtrrl@sha256:b33d69821d4dd8e601fea78b3dde331bacfd2797bda256da1dbdfeb5b1ce12a5
entry: stream_ac # [透传] 镜像 catalog 里的入口名
storage: s3://rtrrl-artifacts-007122174918/trainer # [消费] → 每个 run 的 artifact root

# ── 以下整块透传 ──────────────────────────────────────────

# [透传] 组装计算图要的：由它得到 action_dim 和观测宽度
environment:
  id: brax::hopper
  backend: spring
  observed: [0, 2, 4, 6, 8, 10]
  # 不进图，是 runtime 的随机源。列表而非标量：每个配置在这里的**每个**种子
  # 上各跑一次，而种子**不参与搜索**——两次只差种子的运行是同一个配置量了两
  # 遍，让采样器抽它等于让 study 把预算花在建噪声的模型上。
  # 调参阶段列一个；冻结最佳配置后的正式评估列 10 个（离散）或 5 个（Brax），
  # 并在 `selection` 里声明调参用过哪些，以便拒绝重用。
  seeds: [0]
  episode_length: 1000

# [透传] num_envs 进图（每个 carry/trace 的第一维），另两个是预算
training:
  num_envs: 16
  total_steps: 2000000
  chunk_steps: 10000
  # [可选] 每隔多少步把整个 run 写到 artifacts 旁的 resume.tar.gz。必须是
  # evaluation.every_steps 的整数倍——边界是 run 唯一安静到可以从中续跑的时刻。
  # 省略或填 0 表示不写：被中断就只能从头再来。短到重跑不心疼的 run 就别开。
  # snapshot_every_steps: 200000

# [透传] 流数不在这里：评估复用训练时那张图的宽度
evaluation:
  every_steps: 10000
  # 一个 checkpoint 恰好按这么多条完整 episode 计分。不是步数预算——跑多久由
  # 策略决定，按步数给会让 episode 数随任务和策略变，而那正是形式化协议不允
  # 许变的东西。
  episodes: 5
  # 一次评估调用最多装多少环境步，和 training.chunk_steps 同一种量（内存上
  # 界），与总共要跑多少无关。必须是 num_envs 的整数倍。
  chunk_steps: 1600
  # 评估自己的随机源。写出来，训练的 key 流才不会因为「测没测」而改变；两个
  # 方法声明同一个值，就是在同一批评估 episode 上被比较。
  seed: 1000

logging:
  aim:
    url: aim://172.31.62.192:53801
    training:
      window:
        every_steps: 100000
  rerun:
    log_every_steps: 100000

# [自用] 评分由 Infra 对 Worker 上传的 metrics.jsonl 执行
score:
  metric: eval/episode/return_per_step
  window_steps: [0, 2000000] # 取值范围
  reduce: last # 值序列如何生成分数
  non_finite: worst # nan/inf 处理策略
  direction: maximize

# ── 以下 infra 自用，不过河 ────────────────────────────────

compute:
  instance_type: c7a.large
  timeout_minutes: 90
  # [可选] Batch 最多起几次这个 job，默认 1。只有配合 snapshot_every_steps 才有意义：
  # 没有快照的第二次尝试会把整个预算重跑一遍，最后落在第一次的同一个地方。
  # attempts: 3

hpo:
  rounds: 5
  trials_per_round: 4
  parallel_jobs: 1 # 每轮 Batch job 数；每个 job 内的 trial 串行运行
  startup_trials: 4
  seed: 0

# 对 catalog 搜索域的覆盖。采样后成为运行配置的 params。
#
# 形状与 catalog 相同：每层之内平铺，缩进即分组。选组件的那一项叫 kind，
# 它和它的分支住在同一层，所以 backbone.kind 选，backbone.rtu.* 属于被选中的那个。
# 一个名字在两处出现（两个角色各有 ob）是两个节点，不是重名。
space:
  # 两个角色。分组的层没有 kind——不存在"哪一个 actor"——但两个角色的
  # optimizer 是同一份声明用了两次，各在自己的作用域里。
  actor:
    head:
      kind: [global_std]
      global_std:
        initialization:
          kind: [lecun]
    optimizer:
      bound:
        kind: [none]
      base:
        kind: [sgd]
  critic:
    head:
      kind: [value]
      value:
        initialization:
          kind: [lecun]
    optimizer:
      bound:
        kind: [none]
      base:
        kind: [sgd]

  # 归一化
  normalization:
    observation:
      kind: [running]
    reward:
      kind: [running]

  # 网络
  backbone:
    kind: [rtu]
    rtu:
      hidden_dim: [32]
      differentiation:
        kind: [tbptt]
    # 初始化归有权重可抽的那条分支；rtu 的递推核自己抽，所以 rtu 下没有这一项。
    # 换到 mlp 时是 mlp.initialization.kind: [lecun|sparse]。

  # 梯度信用
  meta_rl: [false]
