experiment: streamac-hopper
name: search-20
description: >
  Twenty trials of StreamAC on masked Brax Hopper, to produce a best setting for
  a cross-implementation ablation rather than to win a score. What it is for:
  the rewritten kernel agrees with upstream's arithmetic block by block and with
  the recorded snapshot to a handful of last bits, but neither of those says the
  two behave alike over two million steps. So this searches, and then the point
  it lands on is run again on upstream's own implementation and the two curves
  are compared.

  Six hyperparameters are searched and everything else is pinned to the settings
  the recorded 1043.66 run used, so the search is over the same slice that sweep
  searched. Twenty TPE trials over six dimensions is not a converged search and
  the best point here should not be read as a tuned one; it is a point both
  implementations can be asked about.

  The seed is fixed. Two runs of the same setting under different seeds differ by
  more than the implementations are expected to, and a comparison that cannot
  separate the two would answer nothing.

  Gradient and trace norms are reported per network part, which is the reading
  this run exists to collect beside the returns: under exact credit the torso
  sees the whole stream while what feeds it sees one step, and whether that
  pulls the two domains apart is the question the ablation after this one asks.

image: 007122174918.dkr.ecr.eu-north-1.amazonaws.com/rtrrl@sha256:0beb5f44302f3b1261160bc4ffdcd524edfb1eaedec461c4e4c221c69c3b929d
entry: stream_ac
storage: s3://rtrrl-artifacts-007122174918/trainer

environment:
  id: brax::hopper
  backend: spring
  observed: [0, 1, 2, 3, 4]
  seed: 0

training:
  num_envs: 16
  total_steps: 2000000
  epoch_steps: 100000

evaluation:
  steps: 1000
  num_envs: 16

compute:
  # Measured, not assumed: the three probe files beside this one ran one tenth of
  # a trial on each CPU queue. A c7a.medium never finished it in 45 minutes, which
  # is its 1600 MiB rather than its one core. A c7a.large finished in 162 seconds
  # and a c7a.xlarge in 134, so twice the cores buy 21% and cost twice as much,
  # and this is the cheaper of the two per trial by 40%. Both returned the same
  # score to every digit, so the choice is only about money and wall clock.
  #
  # g6.xlarge is not an option: it still aborts on a double free part way through
  # compiling, as it did when the reproduction was moved to CPU.
  instance_type: c7a.large
  # A trial of this length measured out at 13 to 19 minutes, so this is three
  # times the estimate rather than an afternoon: a trial that hangs should be cut
  # off, not billed to the timeout.
  timeout_minutes: 60

hpo:
  sampler: tpe
  rounds: 5
  trials_per_round: 4
  # Four at a time, so a round is one trial long in wall clock and the sampler
  # still gets four results to learn from before it suggests the next four.
  parallel_jobs: 4

space:
  backbone: [rtu]
  credit: [rtrl]
  hidden_dim: [128]
  feature_dim: [32]
  meta_rl: [true]
  normalize_observation: [true]
  normalize_reward: [true]
  normalization_statistics: ["ours"]
  gamma: [0.99]
  bounded_rule: ["obgd"]
  beta2: [0.999]
  eps: [1.0e-8]
  # The six the sweep searched, each bracketing the setting it landed on by
  # about a decade either side. Wider would spend the twenty trials on the
  # regions that sweep already ruled out.
  trace_lambda: {type: float, low: 0.5, high: 0.99}
  actor_lr: {type: float, low: 0.01, high: 3.0, log: true}
  critic_lr: {type: float, low: 0.001, high: 1.0, log: true}
  actor_kappa: {type: float, low: 0.5, high: 10.0}
  critic_kappa: {type: float, low: 0.5, high: 10.0}
  entropy_coefficient: {type: float, low: 1.0e-6, high: 1.0e-2, log: true}

score:
  metric: eval/episode/return
  window_steps: [0, 2000000]
  reduce: max
  direction: maximize
  non_finite: worst

logging:
  aim: aim://172.31.62.192:53801
  enable_rerun: true
  rerun_every_steps: 20000
