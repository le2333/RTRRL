experiment: e2e
name: rtrrl-hopper-50m-search-5x2
description: >
  Ten-trial search of memo's RTRRL implementation on Brax Hopper: five
  sequential TPE rounds with two trials per round. The AAAI implementation is
  used only as the reference for unspecified defaults and search ranges. Each
  trial trains for 50M environment steps, reports an evaluation trajectory at
  10M-step intervals, and is ranked by its maximum evaluation return anywhere
  in the 0-50M-step window.

# Immutable memo CPU image built and verified from commit d1afa69.
image: 007122174918.dkr.ecr.eu-north-1.amazonaws.com/rtrrl@sha256:e0d9fd390955a13c7d8b5defe8b459ceb972dd668c36d81ae7a8265aeb54ae28
entry: rtrrl
storage: s3://rtrrl-artifacts-007122174918/trainer

environment:
  id: brax::hopper
  backend: spring
  # Keep the zero-based even indices used by the AAAI Hopper baseline.
  observed: [0, 2, 4, 6, 8, 10]
  num_envs: 1

budget:
  total_steps: 50000000
  epoch_steps: 10000000
  eval_steps: 1000

compute:
  instance_type: c7a.large
  timeout_minutes: 1440

hpo:
  sampler: tpe
  rounds: 5
  trials_per_round: 2
  parallel_jobs: 2
  seed: 20260814

space:
  seed: [1]

  # Memo structure corresponding to the AAAI LRU setup.
  backbone: [lru]
  hidden_dim: [32]
  feature_dim: [32]
  meta_rl: [true]
  bound_actor: [true]
  act_clip: [1.0]
  actor_to_recurrent: [true]
  critic_to_recurrent: [true]
  normalize_observation: [false]
  normalize_reward: [false]

  # Principal learning parameters use the established AAAI ranges.
  gamma: [0.99]
  freeze_gamma: [false]
  lambda_pi: {type: float, low: 0.5, high: 0.99}
  lambda_v: {type: float, low: 0.5, high: 0.99}
  lambda_rnn: {type: float, low: 0.5, high: 0.99}
  eta_pi: [1.0]
  eta_f: [1.0]
  entropy_rate: {type: float, low: 1.0e-6, high: 1.0e-3, log: true}
  update_period: [1.0]
  update_trace_before_td: [false]
  logprob_scale: [1.0]

  update_rule: [adam]
  td_lr: {type: float, low: 1.0e-5, high: 1.0e-3, log: true}
  rnn_lr: {type: float, low: 1.0e-5, high: 1.0e-3, log: true}
  eps: [1.0e-8]
  b1: [0.9]
  b2: [0.999]
  rnn_grad_clip: [1.0]

  # Required by the memo entry but inactive while update_rule=adam.
  kappa: [2.0]
  obgd_beta2: [0.999]
  obgd_rule: [obgd]

score:
  metric: eval/episode_return
  window_steps: [0, 50000000]
  reduce: max
  direction: maximize
  non_finite: worst

logging:
  aim: aim://172.31.62.192:53801
  # RTRRL reports once per epoch; with epoch_steps=10M this preserves the
  # complete 10M/20M/30M/40M/50M training trajectory in Aim experiment e2e.
  every_steps: 1
