experiment: streamac-hopper
name: smoke
description: >
  The reproduction settings at 1/40th of the budget, to be run on a dev queue
  before spending on the real thing. It answers what a dry run cannot: whether
  the worker reaches the runner, whether metrics arrive in Aim and episodes in
  Rerun, what the process actually costs in memory, and how many steps a second
  this instance type sustains. The score is not expected to mean anything.

image: 007122174918.dkr.ecr.eu-north-1.amazonaws.com/rtrrl@sha256:67a47ccde6dddfb1c67265c23365efb0da61ce41d030aa835ce3cc1ed0c1fd60
entry: stream_ac_rtrl
storage: s3://rtrrl-artifacts-007122174918/trainer

compute:
  instance_type: c7a.xlarge
  timeout_minutes: 30

hpo:
  sampler: grid
  rounds: 1
  trials_per_round: 1
  parallel_jobs: 1

space:
  environment: [brax::hopper]
  env_mode: [P]
  env_backend: [spring]
  backbone: [rtu]
  seed: [0]
  num_envs: [16]
  # Two epochs of 1600 iterations each. Short enough to be cheap, long enough
  # that the second epoch proves the loop repeats rather than merely starts.
  total_steps: [51200]
  epoch_steps: [25600]
  eval_steps: [1000]
  hidden_dim: [128]
  feature_dim: [32]
  meta_rl: [true]
  normalize_observation: [true]
  normalize_reward: [true]
  gamma: [0.99]
  trace_lambda: [0.9060749966425912]
  actor_lr: [0.532246925974616]
  critic_lr: [0.11990103985952048]
  actor_kappa: [2.722352816476039]
  critic_kappa: [1.4401857247174306]
  entropy_coefficient: [0.000271109456772485]
  adaptive: [false]
  beta2: [0.999]
  eps: [1.0e-8]

score:
  metric: eval/episode_return
  window_steps: [0, 51200]
  reduce: max
  direction: maximize
  non_finite: worst

logging:
  aim: aim://172.31.62.192:53801
  every_steps: 1
  rerun_every_episodes: 16
