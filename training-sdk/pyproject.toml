[project]
name = "training-sdk"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aim==3.28.*",
    "boto3>=1.35,<2",
    "numpy>=2",
    "pydantic>=2.8,<3",
    "pyyaml>=6,<7",
    "rerun-sdk>=0.34,<0.35",
]

[project.optional-dependencies]
testing = [
    "moto[server]>=5,<6",
]

[dependency-groups]
dev = [
    "moto[server]>=5,<6",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore:.*declarative_base.*:sqlalchemy.exc.MovedIn20Warning",
    "ignore:datetime.datetime.utcnow.*:DeprecationWarning",
]
