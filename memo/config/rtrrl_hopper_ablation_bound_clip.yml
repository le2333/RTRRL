# Ablation C — faithful bounded actor + action clipping (candidate fix).
# Restores the two streaming-rtrrl mechanisms missing from the memorax port:
#   * bound_actor: state-dependent loc (sigmoid_between -> [-1,1]) and log_scale
#     (sigmoid_between -> [-2,2], std=softplus) instead of unbounded mean +
#     global learnable log_std.
#   * act_clip=1.0: clip the env-facing / meta-RL-feedback action to [-1,1].
# If this keeps the closed-loop gain < 1 (no blow-up through 80k), it confirms
# the unbounded actor + un-clipped action feedback is the destabiliser.
# Everything else = RTRRL-HOP-533.
experiment: rtrrl_hopper

seed: 3
total_timesteps: 80000
num_epochs: 80
num_envs: 1

eval_every: 1
eval_steps: 1000
patience: 1000000

logging: null
run_name: RTRRL-HOP-abl-bound-clip

env_name: hopper
mode: F
backend: spring

hidden_dim: 32
encoder_dim: 32
meta_rl: true

gamma: 0.95
lambda_pi: 0.97
lambda_v: 0.9
lambda_rnn: 0.945
td_lr: 3.0e-05
rnn_lr: 2.0e-06
eta_pi: 0.38
eta_f: 0.5
entropy_rate: 3.0e-05
update_period: 0.1
b1: 0.9
b2: 0.999
eps: 1.0e-08
rnn_grad_clip: 1.0

bound_actor: true
act_clip: 1.0
freeze_gamma: false
