# RTRRL x Brax Hopper — NEW-LRU baseline + OBS+REWARD norm + ACTOR LIMIT.
# See rtrrl_hopper_newlru_base.yml for the shared new-LRU topology.
experiment: rtrrl_hopper

seed: 3
total_timesteps: 1000000
num_epochs: 20
num_envs: 1

eval_every: 1
eval_steps: 1000
patience: 1000000

logging: null
run_name: RTRRL-HOP-newlru-rnorm-or-alimit

env_name: hopper
mode: F
backend: spring

hidden_dim: 32
encoder_dim: 32
meta_rl: true
use_encoder: false
lru_output_dim: 32
backbone: lru

# Normalisation: obs + reward.
normalize_obs: true
normalize_reward: true

# Actor limit: bounded actor + action clip.
bound_actor: true
act_clip: 1.0

gamma: 0.95
lambda_pi: 0.97
lambda_v: 0.9
lambda_rnn: 0.945
td_lr: 3.0e-05
rnn_lr: 2.0e-06
eta_pi: 0.38
eta_f: 0.5
entropy_rate: 3.0e-05
update_period: 0.1
b1: 0.9
b2: 0.999
eps: 1.0e-08
rnn_grad_clip: 1.0
