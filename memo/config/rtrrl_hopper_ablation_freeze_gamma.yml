# Ablation B — freeze the LRU input gain gamma_log at init (no gradient).
# Tests whether the monotonic gamma drift (max exp(gamma_log) crossing 1.0 at
# ~28k) is CAUSAL: if pinning gamma removes/delays the blow-up, gamma drift is a
# driver; if it still diverges, gamma is a symptom riding a different loop.
# Everything else = RTRRL-HOP-533.
experiment: rtrrl_hopper

seed: 3
total_timesteps: 80000
num_epochs: 80
num_envs: 1

eval_every: 1
eval_steps: 1000
patience: 1000000

logging: null
run_name: RTRRL-HOP-abl-freeze-gamma

env_name: hopper
mode: F
backend: spring

hidden_dim: 32
encoder_dim: 32
meta_rl: true

gamma: 0.95
lambda_pi: 0.97
lambda_v: 0.9
lambda_rnn: 0.945
td_lr: 3.0e-05
rnn_lr: 2.0e-06
eta_pi: 0.38
eta_f: 0.5
entropy_rate: 3.0e-05
update_period: 0.1
b1: 0.9
b2: 0.999
eps: 1.0e-08
rnn_grad_clip: 1.0

bound_actor: false
act_clip: 0.0
freeze_gamma: true
