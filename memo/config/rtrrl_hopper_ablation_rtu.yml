# Ablation E — swap the recurrent backbone LRU -> RTU (structural probe).
# RTU is the SAME complex rotation-decay core as LRU but (1) applies tanh to the
# state each step => state bounded to [-1,1] (no exponential blow-up), and (2) has
# NO free input gain: its gain is norm=sqrt(1-r^2), tied to nu_log, so the
# self-aligned ∂h/∂γ=h ratchet that drove gamma_max past 1.0 at ~28k simply does
# not exist. So RTU structurally removes BOTH divergence drivers.
# On Hopper (mode F, ~Markov) this mainly tests STABILITY (memory capacity is
# barely needed here); a genuine RTU-vs-LRU memory comparison lives on the
# memory-hard kmemorychain configs. Everything else = RTRRL-HOP-533.
experiment: rtrrl_hopper

seed: 3
total_timesteps: 80000
num_epochs: 80
num_envs: 1

eval_every: 1
eval_steps: 1000
patience: 1000000

logging: null
run_name: RTRRL-HOP-abl-rtu

env_name: hopper
mode: F
backend: spring

hidden_dim: 32
encoder_dim: 32
meta_rl: true
backbone: rtu

gamma: 0.95
lambda_pi: 0.97
lambda_v: 0.9
lambda_rnn: 0.945
td_lr: 3.0e-05
rnn_lr: 2.0e-06
eta_pi: 0.38
eta_f: 0.5
entropy_rate: 3.0e-05
update_period: 0.1
b1: 0.9
b2: 0.999
eps: 1.0e-08
rnn_grad_clip: 1.0

bound_actor: false
act_clip: 0.0
freeze_gamma: false
