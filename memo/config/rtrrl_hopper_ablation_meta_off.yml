# Ablation A — meta-RL feedback loop OFF.
# Isolates the action->input feedback arm: input is obs only (no [a, r]). If
# divergence is delayed/removed vs the 533 baseline, the meta-RL loop is a major
# contributor; if it still blows at ~28k, the driver is elsewhere (gamma/value).
# Everything else = RTRRL-HOP-533. 80k steps / 80 epochs => 1000-step chunks
# with dense (per-epoch) eval, long enough to pass the baseline blow-up (~45k).
experiment: rtrrl_hopper

seed: 3
total_timesteps: 80000
num_epochs: 80
num_envs: 1

eval_every: 1
eval_steps: 1000
patience: 1000000

logging: null
run_name: RTRRL-HOP-abl-meta-off

env_name: hopper
mode: F
backend: spring

hidden_dim: 32
encoder_dim: 32
meta_rl: false

gamma: 0.95
lambda_pi: 0.97
lambda_v: 0.9
lambda_rnn: 0.945
td_lr: 3.0e-05
rnn_lr: 2.0e-06
eta_pi: 0.38
eta_f: 0.5
entropy_rate: 3.0e-05
update_period: 0.1
b1: 0.9
b2: 0.999
eps: 1.0e-08
rnn_grad_clip: 1.0

bound_actor: false
act_clip: 0.0
freeze_gamma: false
