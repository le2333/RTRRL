# Ablation D — auxiliary self-prediction head (target-side representation anchor).
# A linear head off the shared torso predicts (next_obs, next_reward); its MSE
# gradient is added directly (like entropy) to the torso + pred-head updates.
# The external fixed-scale target gives the representation a set-point, which
# should oppose the target-less gamma/h inflation (unlike clip/RTU which only
# cap the blow-up, this directly fights the monotonic drift). Tests whether the
# gamma creep flattens / carry stays bounded through 80k.
# Everything else = RTRRL-HOP-533 (no clip/bound/freeze).
experiment: rtrrl_hopper

seed: 3
total_timesteps: 80000
num_epochs: 80
num_envs: 1

eval_every: 1
eval_steps: 1000
patience: 1000000

logging: null
run_name: RTRRL-HOP-abl-pred-obs

env_name: hopper
mode: F
backend: spring

hidden_dim: 32
encoder_dim: 32
meta_rl: true

gamma: 0.95
lambda_pi: 0.97
lambda_v: 0.9
lambda_rnn: 0.945
td_lr: 3.0e-05
rnn_lr: 2.0e-06
eta_pi: 0.38
eta_f: 0.5
entropy_rate: 3.0e-05
update_period: 0.1
b1: 0.9
b2: 0.999
eps: 1.0e-08
rnn_grad_clip: 1.0

bound_actor: false
act_clip: 0.0
freeze_gamma: false
pred_obs: true
pred_coeff: 1.0
