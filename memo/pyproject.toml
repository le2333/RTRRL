[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["memorax*", "runner*", "entries*", "worker*"]

[project]
name = "memorax"
version = "1.0.1"
description = "A unified JAX/Flax framework for memory-augmented reinforcement learning with support for RNNs, SSMs, and Transformers"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Noah Farr" }]
keywords = ["jax", "flax", "reinforcement-learning", "memory", "rnn", "ssm", "transformer", "pomdp"]

dependencies = [
    "jax>=0.7.0",
    # Nine files import it directly; it used to arrive through jax, which is a
    # dependency of a dependency deciding what this package can compile against.
    "numpy>=2",
    # The contract this side validates what it receives against, and the S3 both
    # sides read and write through. Neither arrives via a shared package now.
    "pydantic>=2.8,<3",
    "boto3>=1.35,<2",
    "flax>=0.10.2",
    "lox @ git+https://github.com/huterguier/lox@dev",
    "distrax>=0.1.5",
    "flashbax>=0.1.0",
    "gymnax>=0.0.9",
    "brax>=0.12.4",
    # Aim's log_system_params imports pkg_resources at runtime; uv-created venvs
    # don't ship setuptools, so add it explicitly. Pin <81: setuptools 81 removed
    # pkg_resources, which aim 3.28 still needs.
    "setuptools>=68,<81",
    # The sinks moved here with the worker, and their dependencies with them:
    # the control plane hosts the Aim server but has no reason to install its
    # client to read four pydantic models.
    "aim==3.28.*",
    "rerun-sdk>=0.34,<0.35",
]

[project.urls]
Homepage = "https://github.com/noahfarr/memorax"
Repository = "https://github.com/noahfarr/memorax"
Documentation = "https://memorax.readthedocs.io"

[project.optional-dependencies]
# Pinned to the jax the lock already resolves, so asking for the GPU plugin
# adds the CUDA wheels without moving jax itself under the CPU image.
cuda12    = ["jax[cuda12]==0.10.0"]
brax      = ["brax>=0.12.4"]
jumanji   = ["jumanji>=1.1.1"]
navix     = ["navix>=0.7.0"]
craftax   = ["craftax>=1.5.0"]
popgym    = ["popgym", "gymnasium"]
foragax   = ["continual-foragax"]
popgym-arcade    = ["popgym-arcade>=0.0.4"]
mujoco-playground = ["playground>=0.0.5", "warp-lang>=1.9.1"]
grimax    = ["grimax"]
cogames   = ["cogames"]
gymnasium = ["gymnasium"]
ale       = ["ale-py[gymnasium]"]
mujoco    = ["gymnasium[mujoco]"]
pufferlib = ["pufferlib-core"]
gxm       = ["gxm"]
pobax     = ["pobax"]
popjym    = ["popjym"]
xminigrid = ["xminigrid"]
jaxmarl   = ["jaxmarl", "brax"]
memory-gym = ["memory-gym", "gymnasium"]

environments = [
    "brax>=0.12.4",
    "gymnax>=0.0.9",
    "jumanji>=1.1.1",
    "navix>=0.7.0",
    "craftax>=1.5.0",
    "popgym",
    "popgym-arcade>=0.0.4",
    "memory-gym",
    "continual-foragax",
    "warp-lang>=1.9.1",
    "playground>=0.0.5",
    "jaxmarl==0.1.0",
    "gxm",
    "popjym",
    "pobax",
    "xminigrid",
]

[dependency-groups]
development = [
    "pre-commit>=4.2.0",
    "pytest",
    "pyyaml>=6",
    "pyright",
    "black>=26.3.1",
    "isort>=8.0.1",
    "ruff>=0.15.22",
    # The S3 fixtures the moved worker tests use.
    "moto[server]>=5,<6",
]
# The published streaming-drl optimisers, so the bounded step can be compared
# against the paper's own code rather than against a reading of it. CPU wheels
# only, and nothing outside the test suite imports torch.
paper = [
    "torch>=2.6",
]
docs = [
    "sphinx>=7.2.0",
    "sphinx-book-theme>=1.1.0",
    "myst-parser>=2.0.0",
    "sphinx-autodoc-typehints>=1.25.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.5.0",
    "sphinx-autobuild>=2025.8.25",
]

[tool.uv]
package = true

[[tool.uv.dependency-metadata]]
name = "jaxmarl"
requires-dist = []


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
continual-foragax = { git = "https://github.com/steventango/continual-foragax" }
grimax  = { git = "ssh://git@github.com/noahfarr/grimax" }
cogames = { git = "https://github.com/Metta-AI/cogames" }
gxm     = { git = "https://github.com/huterguier/gxm", rev = "dev", extra = "gxm" }
pobax   = { git = "https://github.com/taodav/pobax" }
popjym  = { git = "https://github.com/EdanToledo/popjym.git", extra = "popjym" }
performax = { git = "https://github.com/noahfarr/performax.git" }
lox       = { git = "https://github.com/huterguier/lox", rev = "dev" }
