[pytest]
testpaths = tests
addopts = -ra -q
# ../infra/src is on the path, not installed: the round-trip test imports the
# control plane's resolver and sampler to run the real chain against this
# side's own reading of it. Installing the package would make the image depend
# on a control plane it only ever hears from through a JSON file.
pythonpath = . ../infra/src
filterwarnings =
    error::numpy.exceptions.ComplexWarning
