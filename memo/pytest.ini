[pytest]
testpaths = tests
addopts = -ra -q -m "not external and not service and not container"
# ../infra/src is on the path, not installed: the round-trip test imports the
# control plane's resolver and sampler to run the real chain against this
# side's own reading of it. Installing the package would make the image depend
# on a control plane it only ever hears from through a JSON file.
pythonpath = . ../infra/src
filterwarnings =
    error::numpy.exceptions.ComplexWarning
markers =
    parity: compares two implementations numerically
    external: requires a separately obtained reference checkout or framework
    service: starts or embeds a real service implementation
    integration: crosses two or more production ownership boundaries
    container: requires a built container and is not an ordinary local test
