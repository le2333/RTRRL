name: memo_rtrrl
argv:
  - python
  - /app/experiments/memo_rtrrl/run.py
  - --config
  - "{config_path}"
sdk_protocol_version: "1"
environments:
  - hopper
defaults:
  environment:
    name: hopper
    options:
      env_name: hopper
      mode: F
      backend: spring
      max_episode_steps: 1000
      normalize_obs: true
      normalize_reward: true
  training_budget:
    env_steps: 1000000
  logging:
    aim_every_env_steps: 50000
    rerun_every_episodes: 20
objective:
  metric: eval/rewards
  direction: maximize
  reduction: last
fields:
  rtrrl_topology:
    path: algorithm.rtrrl_topology
    type: str
    default: shared
    choices: [shared]
  seed:
    path: runtime.seed
    type: int
    default: 0
    constraints: {ge: 0}
  backbone:
    path: network.backbone
    type: str
    default: lru
    choices: [lru, rtu]
  hidden_dim:
    path: network.hidden_dim
    type: int
    default: 32
    searchable: true
    constraints: {gt: 0}
    default_search:
      values: [16, 32, 64]
  gamma:
    path: algorithm.gamma
    type: float
    default: 0.95
    searchable: true
    constraints: {gt: 0, le: 1}
    default_search: {min: 0.9, max: 1.0, scale: linear}
  lambda_pi:
    path: algorithm.lambda_pi
    type: float
    default: 0.97
    searchable: true
    constraints: {ge: 0, le: 1}
    default_search: {min: 0.8, max: 1.0, scale: linear}
  lambda_v:
    path: algorithm.lambda_v
    type: float
    default: 0.9
    searchable: true
    constraints: {ge: 0, le: 1}
    default_search: {min: 0.8, max: 1.0, scale: linear}
  lambda_rnn:
    path: algorithm.lambda_rnn
    type: float
    default: 0.945
    searchable: true
    constraints: {ge: 0, le: 1}
    default_search: {min: 0.8, max: 1.0, scale: linear}
  td_lr:
    path: algorithm.td_lr
    type: float
    default: 0.00003
    searchable: true
    constraints: {gt: 0}
    default_search: {min: 0.000001, max: 0.001, scale: log}
  rnn_lr:
    path: algorithm.rnn_lr
    type: float
    default: 0.000002
    searchable: true
    constraints: {gt: 0}
    default_search: {min: 0.0000001, max: 0.0001, scale: log}
  eta_pi:
    path: algorithm.eta_pi
    type: float
    default: 0.38
    searchable: true
    constraints: {gt: 0}
    default_search: {min: 0.05, max: 1.0, scale: log}
  eta_f:
    path: algorithm.eta_f
    type: float
    default: 0.5
    searchable: true
    constraints: {gt: 0}
    default_search: {min: 0.05, max: 1.0, scale: log}
  entropy_rate:
    path: algorithm.entropy_rate
    type: float
    default: 0.00003
    searchable: true
    constraints: {ge: 0}
    default_search: {min: 0.000001, max: 0.001, scale: log}
