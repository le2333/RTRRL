name: memo_stream_ac
argv:
  - python
  - /app/experiments/memo_stream_ac/run.py
  - --config
  - "{config_path}"
sdk_protocol_version: "1"
environments:
  - memory_chain
  - kmemory_chain
  - mujoco_masked
defaults:
  environment:
    name: memory_chain
    options:
      length: 16
      max_episode_steps: 16
  training_budget:
    env_steps: 500000
  logging:
    aim_every_env_steps: 10000
    rerun_every_episodes: 100
objective:
  metric: eval/rewards
  direction: maximize
  reduction: last
fields:
  agent_type:
    path: algorithm.agent_type
    type: str
    default: rtu_rtrl
    choices: [rtu_rtrl]
  seed:
    path: runtime.seed
    type: int
    default: 0
    constraints: {ge: 0}
  hidden_dim:
    path: network.hidden_dim
    type: int
    default: 192
    searchable: true
    constraints: {gt: 0}
    default_search:
      values: [64, 128, 192]
  encoder_dim:
    path: network.encoder_dim
    type: int
    default: 64
    searchable: true
    constraints: {gt: 0}
    default_search:
      values: [32, 64, 128]
  gamma:
    path: algorithm.gamma
    type: float
    default: 0.99
    searchable: true
    constraints: {gt: 0, le: 1}
    default_search: {min: 0.9, max: 1.0, scale: linear}
  trace_lambda:
    path: algorithm.trace_lambda
    type: float
    default: 0.9
    searchable: true
    constraints: {ge: 0, le: 1}
    default_search: {min: 0.7, max: 1.0, scale: linear}
  actor_lr:
    path: algorithm.actor_lr
    type: float
    default: 1.0
    searchable: true
    constraints: {gt: 0}
    default_search: {min: 0.01, max: 2.0, scale: log}
  critic_lr:
    path: algorithm.critic_lr
    type: float
    default: 1.0
    searchable: true
    constraints: {gt: 0}
    default_search: {min: 0.01, max: 2.0, scale: log}
  entropy_coefficient:
    path: algorithm.entropy_coefficient
    type: float
    default: 0.01
    searchable: true
    constraints: {ge: 0}
    default_search: {min: 0.00001, max: 0.1, scale: log}
  num_envs:
    path: runtime.num_envs
    type: int
    default: 16
    constraints: {gt: 0}
