name: Tests

# The development machine is a micro instance and cannot run the suite without
# running out of memory, so this workflow is the only place tests execute.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tests.yml
      - infra/**
      # infra's round-trip test validates against the worker's own contract
      # module and the shipped experiment template.
      - memo/worker/contract.py
      - memo/memorax/parameters.py
      - experiments/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: infra
            project: infra
            target: ""
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint
        working-directory: ${{ matrix.project }}
        run: uv run ruff check .

      - name: Test
        working-directory: ${{ matrix.project }}
        run: uv run pytest ${{ matrix.target }} -q
