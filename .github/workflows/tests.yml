name: Tests

# The development machine is a micro instance and cannot run the suite without
# running out of memory, so this workflow is the only place tests execute.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tests.yml
      - infra/**
      - rtrrl/infra/control-plane/**
      - rtrrl/infra/mock-trainer/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The control plane this branch develops. The two below are the paper
          # project's own, one generation older, and still its own thing.
          - name: infra
            project: infra
            target: ""
          - name: control-plane
            project: rtrrl/infra/control-plane
            target: ""
          - name: mock-trainer
            project: rtrrl/infra/mock-trainer
            target: ""
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint
        working-directory: ${{ matrix.project }}
        run: uv run ruff check .

      - name: Test
        working-directory: ${{ matrix.project }}
        run: uv run pytest ${{ matrix.target }} -q
