name: Memo CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/memo-ci.yml"
      - "memo/**"
  push:
    paths:
      - ".github/workflows/memo-ci.yml"
      - "memo/**"

permissions:
  contents: read

concurrency:
  group: memo-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: memo

env:
  JAX_PLATFORM_NAME: cpu
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  # mohmdelsayed/streaming-drl, the code behind the streaming RL paper. Pinned
  # so the numbers our rules answer to cannot change under us.
  STREAMING_DRL_COMMIT: 407dca7a8b584c1c20bc649053557f66e270b1e6

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHECKED: >-
        memorax/rl
        memorax/algorithms/contract.py
        memorax/algorithms/rtrrl.py
        memorax/algorithms/stream_ac.py
        memorax/algorithms/upstream_stream_ac.py
        memorax/algorithms/independent_rtrrl.py
        memorax/utils/trees.py
        memorax/networks/backbones.py
        memorax/networks/components.py
        memorax/networks/initialization.py
        memorax/networks/initializers/sparse.py
        memorax/networks/readouts.py
        memorax/networks/sequence.py
        memorax/runtime
        entries
        runner
        tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: memo/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --group development --group paper
      - name: Type check
        run: uv run pyright $CHECKED
      - name: Check formatting
        run: uv run black --check $CHECKED
      - name: Check import order
        run: uv run isort --check-only --profile=black $CHECKED
      - name: Lint
        run: uv run ruff check $CHECKED

  algorithms:
    name: Algorithm suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: memo/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --group development --group paper
      # The published optimisers the bounded step answers to. Cloned rather
      # than vendored: that repository is CC BY-NC and this one is not.
      - name: Fetch the published streaming-drl optimisers
        run: |
          git clone --quiet https://github.com/mohmdelsayed/streaming-drl.git "$RUNNER_TEMP/streaming-drl"
          git -C "$RUNNER_TEMP/streaming-drl" checkout --quiet $STREAMING_DRL_COMMIT
          echo "STREAMING_DRL=$RUNNER_TEMP/streaming-drl" >> "$GITHUB_ENV"
      - name: Run algorithm suite
        run: uv run pytest tests -v
      # Its own step because x64 is a process-wide JAX flag. The suite above runs
      # in the precision the trainer runs in, and this asks what that precision
      # costs, by rerunning the two LRUs against a double-precision reference.
      - name: Compare the two LRUs against a double-precision reference
        # Nothing it compares is touched by the suite above, so a failure there is
        # not a reason to leave this unrun and unreported.
        if: ${{ !cancelled() }}
        env:
          JAX_ENABLE_X64: "1"
        run: uv run pytest tests/test_lru_precision.py -v -s
      - name: Build the catalog the image will carry
        run: uv run python -m runner.catalog --print-label > /dev/null
