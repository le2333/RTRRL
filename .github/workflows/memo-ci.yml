name: Memo CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/memo-ci.yml"
      - "memo/**"
      # The round-trip test runs the control plane's own resolver and sampler,
      # so a change there can break this suite without touching memo/.
      - "infra/src/**"
      - "experiments/**"
  push:
    paths:
      - ".github/workflows/memo-ci.yml"
      - "memo/**"
      - "infra/src/**"
      - "experiments/**"

permissions:
  contents: read

concurrency:
  group: memo-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: memo

env:
  JAX_PLATFORM_NAME: cpu
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  # mohmdelsayed/streaming-drl, the code behind the streaming RL paper. Pinned
  # so the numbers our rules answer to cannot change under us.
  STREAMING_DRL_COMMIT: 407dca7a8b584c1c20bc649053557f66e270b1e6
  RTRRL_AAAI25_COMMIT: 4301943c349171d828d0fcf3e40944c286451415
  # sharifnassab/Intentional_RL, the code behind the intentional-update paper.
  INTENTIONAL_RL_COMMIT: e86e26fd8613ac212e9a52c3fed8a01d0a31f685

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHECKED: >-
        memorax/rl
        memorax/assembly.py
        memorax/building.py
        memorax/algorithms/contract.py
        memorax/algorithms/r2d2.py
        memorax/algorithms/rtrrl_aaai.py
        memorax/algorithms/rtrrl_ctrnn_rflo.py
        memorax/algorithms/rtrrl_lstm_rflo.py
        memorax/algorithms/stream_ac.py
        memorax/utils/trees.py
        memorax/networks/backbones.py
        memorax/networks/components.py
        memorax/networks/initialization.py
        memorax/networks/initializers/sparse.py
        memorax/networks/readouts.py
        memorax/networks/sequence.py
        memorax/networks/sequence_models/ctrnn.py
        memorax/networks/sequence_models/lstm.py
        memorax/parameters.py
        memorax/observability
        memorax/runtime
        entries
        deployment
        worker
        tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: memo/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --group development --group paper
      - name: Type check
        run: uv run pyright $CHECKED
      - name: Check formatting
        run: uv run black --check $CHECKED
      - name: Check import order
        run: uv run isort --check-only --profile=black $CHECKED
      - name: Lint
        run: uv run ruff check $CHECKED

  algorithms:
    name: Algorithm suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: memo/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --group development --group paper
      # The published optimisers the bounded step answers to. Cloned rather
      # than vendored: that repository is CC BY-NC and this one is not.
      - name: Fetch the published streaming-drl optimisers
        run: |
          git clone --quiet https://github.com/mohmdelsayed/streaming-drl.git "$RUNNER_TEMP/streaming-drl"
          git -C "$RUNNER_TEMP/streaming-drl" checkout --quiet $STREAMING_DRL_COMMIT
          echo "STREAMING_DRL=$RUNNER_TEMP/streaming-drl" >> "$GITHUB_ENV"
      - name: Fetch the published RTRRL implementation
        run: |
          git clone --quiet https://github.com/FranzKnut/RTRRL-AAAI25.git "$RUNNER_TEMP/RTRRL-AAAI25"
          git -C "$RUNNER_TEMP/RTRRL-AAAI25" checkout --quiet $RTRRL_AAAI25_COMMIT
          echo "RTRRL_AAAI25=$RUNNER_TEMP/RTRRL-AAAI25" >> "$GITHUB_ENV"
      - name: Fetch the published intentional-update optimizer
        run: |
          git clone --quiet https://github.com/sharifnassab/Intentional_RL.git "$RUNNER_TEMP/Intentional_RL"
          git -C "$RUNNER_TEMP/Intentional_RL" checkout --quiet $INTENTIONAL_RL_COMMIT
          echo "INTENTIONAL_RL=$RUNNER_TEMP/Intentional_RL" >> "$GITHUB_ENV"
      - name: Run fast and local-parity suites
        run: uv run pytest tests -m "not external and not service and not container" -v
      - name: Run service integrations
        run: uv run pytest tests -m service -v
      - name: Compare against pinned external implementations
        run: uv run pytest tests -m external -v
      - name: Build the catalog the image will carry
        run: uv run python -m deployment.catalog --print-label > /dev/null
