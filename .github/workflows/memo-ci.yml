name: Memo CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/memo-ci.yml"
      - "memo/**"
  push:
    paths:
      - ".github/workflows/memo-ci.yml"
      - "memo/**"

permissions:
  contents: read

concurrency:
  group: memo-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: memo

env:
  JAX_PLATFORM_NAME: cpu
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHECKED: >-
        memorax/rl
        memorax/algorithms/contract.py
        memorax/algorithms/rtrrl.py
        memorax/algorithms/stream_ac_rtrl.py
        memorax/algorithms/independent_rtrrl.py
        memorax/networks/adapter.py
        memorax/utils/trees.py
        tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: memo/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --group development
      - name: Type check
        run: uv run pyright $CHECKED
      - name: Check formatting
        run: uv run black --check $CHECKED
      - name: Check import order
        run: uv run isort --check-only --profile=black $CHECKED
      - name: Lint
        run: uv run ruff check $CHECKED

  algorithms:
    name: Algorithm suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: memo/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --group development
      - name: Run algorithm suite
        run: uv run pytest tests -v
