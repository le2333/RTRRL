name: Build and push memo image

# Builds the memorax-rtrl (Stream AC(λ)+RTU-RTRL / RTRRL-in-memorax, JAX 0.10)
# training image from the memo/ subproject. Independent of rtrrl/: separate build
# context, separate pyproject/uv.lock, separate ECR tags (memorax-rtrl-cpu /
# memorax-rtrl-gpu, matching memo/project.env).

on:
  push:
    branches: [main]
    paths:
      - "memo/**"
      - ".github/workflows/build-memo-image.yml"
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPO: rtrrl
  AWS_ROLE_ARN: arn:aws:iam::007122174918:role/rtrrl-github-actions-role

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: memorax-rtrl-cpu
            dockerfile: memo/infra/docker/Dockerfile
          - tag: memorax-rtrl-gpu
            dockerfile: memo/infra/docker/Dockerfile.gpu
    steps:
      - uses: actions/checkout@v4

      # docker-container driver is required for the type=gha build cache below
      # (the default docker driver cannot export/import the GHA cache).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPO" --region "$AWS_REGION" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPO" --region "$AWS_REGION" >/dev/null

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push (${{ matrix.tag }})
        uses: docker/build-push-action@v6
        with:
          context: memo
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ matrix.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}-${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
