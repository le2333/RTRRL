name: Build memo training image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-memo-image.yml
      - .dockerignore
      - memo/**
      - training-sdk/**
  workflow_dispatch:
    inputs:
      push:
        description: Push the images to the existing ECR repository
        required: true
        type: boolean
        default: false
      confirm_account:
        description: "Required only for push: enter the exact AWS account ID"
        required: false
        type: string
        default: ""
      gpu:
        description: "Also build the CUDA image (parked: the GPU aborts in XLA's fusion emitter)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-memo-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The CUDA variant is built on request only. It costs three times the CPU
        # variant's minutes and it is the one that sets a build's wall clock,
        # while the GPU itself aborts inside XLA's fusion emitter and so nothing
        # currently runs on the image. Ask for it when working on that.
        variant: ${{ fromJSON(inputs.gpu && '["cpu","gpu"]' || '["cpu"]') }}
    env:
      IMAGE: memo-trainer:${{ matrix.variant }}
      DOCKERFILE: memo/docker/Dockerfile.${{ matrix.variant }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.25"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Reclaim runner disk for the CUDA wheels
        if: ${{ matrix.variant == 'gpu' }}
        shell: bash
        run: |
          set -euo pipefail
          # The GPU image is several gigabytes of nvidia wheels and the hosted
          # runner does not have room for it beside its preinstalled toolchains.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Build the catalog by scanning the entries
        id: catalog
        shell: bash
        working-directory: memo
        run: |
          set -euo pipefail
          CATALOG="$(uv run --frozen python -m deployment.catalog --print-label)"
          echo "value=$CATALOG" >> "$GITHUB_OUTPUT"

      - name: Build local image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: |
            TRAINER_CATALOG_V2=${{ steps.catalog.outputs.value }}

      - name: Verify the image is the one the control plane will read
        shell: bash
        env:
          EXPECTED_LABEL: ${{ steps.catalog.outputs.value }}
        run: |
          set -euo pipefail
          ACTUAL_LABEL="$(docker image inspect --format '{{ index .Config.Labels "org.rtrrl.trainer.catalog.v2" }}' "$IMAGE")"
          test "$ACTUAL_LABEL" = "$EXPECTED_LABEL"
          docker run --rm "$IMAGE" test -f /opt/trainer/catalog.json

          # A Batch job overrides nothing, so the image's own command is what
          # runs. Without a manifest the worker must refuse and say why: that
          # message is all CloudWatch would show.
          CMD="$(docker image inspect --format '{{ join .Config.Cmd " " }}' "$IMAGE")"
          test "$CMD" = 'python -m worker'
          if docker run --rm "$IMAGE" >worker-start.log 2>&1; then
            echo "the worker exited 0 without a manifest" >&2
            exit 1
          fi
          grep -q 'TRAINER_MANIFEST is not set' worker-start.log

          # The control plane never ships inside a trainer, and every entry the
          # catalog advertises has to be reachable the way the catalog spells
          # it. Asking the catalog rather than naming an entry here is the
          # point: a job that reaches Batch only to find its module missing
          # costs an instance to discover.
          docker run --rm "$IMAGE" python -c '
          import importlib, importlib.util, json
          import memorax, training_sdk
          assert importlib.util.find_spec("trainer_infra") is None
          with open("/opt/trainer/catalog.json", encoding="utf-8") as handle:
              catalog = json.load(handle)
          assert catalog["entries"], "the image advertises no entry at all"
          for name, entry in sorted(catalog["entries"].items()):
              command = entry["command"]
              assert command[:2] == ["python", "-m"], (name, command)
              importlib.import_module(command[2])
              print("entry", name, "->", command[2])
          '

      - name: Verify the CPU image stays on the CPU
        if: ${{ matrix.variant == 'cpu' }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE" python -c '
          import jax
          assert jax.default_backend() == "cpu", jax.default_backend()
          '

      - name: Verify the GPU image carries a CUDA jax
        if: ${{ matrix.variant == 'gpu' }}
        shell: bash
        run: |
          set -euo pipefail
          # The runner has no GPU, so the backend cannot be exercised here. What
          # can be checked is that the plugin is installed at all: without it the
          # image runs perfectly well on the CPU of a GPU instance and the only
          # symptom is a bill and a slow run.
          docker run --rm "$IMAGE" python -c '
          import importlib.util
          for name in ("jax_cuda12_plugin", "jax_plugins.xla_cuda12"):
              if importlib.util.find_spec(name) is not None:
                  break
          else:
              raise SystemExit("no CUDA plugin in the GPU image")
          import jax
          print("jax", jax.__version__, "backend here:", jax.default_backend())
          '
          # And a debugger, since a native abort on a GPU instance is only worth
          # one job if the stack can be read out of it.
          docker run --rm "$IMAGE" gdb --version | head -n 1

      - name: Verify the shipped Brax environments actually build
        shell: bash
        run: |
          set -euo pipefail
          # Building the environment is the step that needs brax present and
          # the observation mask intact. A partially observed Hopper that
          # quietly hands back its velocities is still a Hopper that trains, so
          # the mask is checked by value rather than by shape: the run would
          # otherwise look healthy and mean nothing.
          docker run --rm "$IMAGE" python -c '
          import jax
          from memorax.environments import make
          env, params = make("brax::hopper", mode="P", backend="spring")
          observation, _ = env.reset(jax.random.key(0), params)
          assert observation.shape == (11,), observation.shape
          assert (observation[5:] == 0).all(), "velocities survived the P mask"
          assert env.action_space(params).shape == (3,)

          env, params = make("brax::halfcheetah", backend="spring")
          observation, _ = env.reset(jax.random.key(1), params)
          assert observation.shape == (17,), observation.shape
          assert env.action_space(params).shape == (6,)
          '

  push:
    name: Rebuild and push (${{ matrix.variant }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.push == true }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.gpu && '["cpu","gpu"]' || '["cpu"]') }}
    env:
      IMAGE: memo-trainer:${{ matrix.variant }}
      DOCKERFILE: memo/docker/Dockerfile.${{ matrix.variant }}
      ECR_TAG: memo-trainer-${{ matrix.variant }}-20260726
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.25"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Reclaim runner disk for the CUDA wheels
        if: ${{ matrix.variant == 'gpu' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Rebuild catalog
        id: catalog
        shell: bash
        working-directory: memo
        run: |
          set -euo pipefail
          CATALOG="$(uv run --frozen python -m deployment.catalog --print-label)"
          echo "value=$CATALOG" >> "$GITHUB_OUTPUT"

      - name: Rebuild local image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: |
            TRAINER_CATALOG_V2=${{ steps.catalog.outputs.value }}

      - name: Confirm account and role boundary
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ vars.INFRA_ACCEPTANCE_AWS_ROLE_ARN }}
          CONFIRM_ACCOUNT: ${{ inputs.confirm_account }}
        run: |
          set -euo pipefail
          test "$CONFIRM_ACCOUNT" = "007122174918"
          case "$AWS_ROLE_ARN" in
            arn:aws:iam::007122174918:role/*) ;;
            *)
              echo "INFRA_ACCEPTANCE_AWS_ROLE_ARN is outside the approved boundary" >&2
              exit 1
              ;;
          esac

      - name: Configure push-only AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ vars.INFRA_ACCEPTANCE_AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Verify authenticated AWS account
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "007122174918"

      - name: Log in to existing ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64

      - name: Push and report the immutable digest
        shell: bash
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ env.ECR_TAG }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          REMOTE="$REGISTRY/rtrrl:$TAG"
          docker tag "$IMAGE" "$REMOTE"
          OUTPUT="$(docker push "$REMOTE" 2>&1)"
          printf '%s\n' "$OUTPUT"
          DIGEST="$(printf '%s\n' "$OUTPUT" | awk '/digest: sha256:/ {print $3}' | tail -n 1)"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          # This is what the experiment file's image: field must be set to.
          {
            echo "### Immutable image ($VARIANT)"
            echo '```'
            echo "$REGISTRY/rtrrl@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
