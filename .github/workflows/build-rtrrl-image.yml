name: Build and push rtrrl image

# Builds the streaming-rtrrl (RTRRL AAAI'25 / JAX 0.5) training image from the
# rtrrl/ subproject. memo/ has its own independent workflow + image; the two
# projects never share a build context or dependency set.

on:
  push:
    branches: [main]
    paths:
      - "rtrrl/**"
      - ".github/workflows/build-rtrrl-image.yml"
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPO: rtrrl
  AWS_ROLE_ARN: arn:aws:iam::007122174918:role/rtrrl-github-actions-role

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: cpu
            dockerfile: rtrrl/infra/docker/Dockerfile
          - tag: gpu
            dockerfile: rtrrl/infra/docker/Dockerfile.gpu
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Encode trainer script catalog
        id: catalog
        run: |
          echo "value=$(uv run --project rtrrl/infra/control-plane trainer-image-catalog rtrrl/infra/scripts/index.yaml)" >> "$GITHUB_OUTPUT"

      # docker-container driver is required for the type=gha build cache below
      # (the default docker driver cannot export/import the GHA cache).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPO" --region "$AWS_REGION" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPO" --region "$AWS_REGION" >/dev/null

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push (${{ matrix.tag }})
        uses: docker/build-push-action@v6
        with:
          context: rtrrl
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: |
            TRAINER_SCRIPT_CATALOG=${{ steps.catalog.outputs.value }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ matrix.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}-${{ matrix.tag }}
          cache-from: type=gha,scope=rtrrl-${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=rtrrl-${{ matrix.tag }}
